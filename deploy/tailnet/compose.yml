name: mdbase-connect-staging

services:
  postgres:
    image: postgres:17-alpine
    command:
      - postgres
      - -c
      - shared_buffers=48MB
      - -c
      - max_connections=25
      - -c
      - work_mem=2MB
    environment:
      POSTGRES_DB: mdbase_connect
      POSTGRES_USER: mdbase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdbase -d mdbase_connect"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 256m
    restart: unless-stopped

  connect:
    image: mdbase-connect-server:staging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 127.0.0.1
      PORT: 8787
      PUBLIC_URL: ${PUBLIC_URL}
      DATABASE_URL: postgres://mdbase:${POSTGRES_PASSWORD}@127.0.0.1:5432/mdbase_connect
      MDBASE_CONNECT_DEV_AUTH: "0"
      MDBASE_CONNECT_TAILSCALE_AUTH: "1"
      MDBASE_CONNECT_ALLOW_INSECURE_MANIFESTS: "1"
    network_mode: host
    mem_limit: 256m
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  postgres-data:
