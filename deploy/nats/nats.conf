# Core NATS only: relay messages are transient and are never written to disk.
host: 0.0.0.0
port: 4222
# Render uses this HTTP endpoint to discover and health-check the private
# service. Relay clients continue to use the authenticated NATS port above.
http: $MDBASE_NATS_HTTP_ADDR

# Encrypted relay envelopes can approach the Connect HTTP body's 2 MiB limit
# after JSON encoding. Keep this below NATS's recommended 8 MiB ceiling.
max_payload: 4MB
max_pending: 32MB
write_deadline: "10s"

authorization {
  users: [
    {
      user: mdbase-connect
      password: $MDBASE_NATS_PASSWORD
      permissions: {
        publish: ["mdbase.connect.relay.v1.>", "_INBOX.>"]
        subscribe: ["mdbase.connect.relay.v1.>", "_INBOX.>"]
      }
    }
    {
      # Render also performs a bare TCP probe against every detected port.
      # Permit the handshake but grant it no messaging capability.
      user: health
      permissions: {
        publish: []
        subscribe: []
      }
    }
  ]
}
no_auth_user: health
