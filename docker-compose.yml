x-connect-image: &connect-image
  image: ${MDBASE_CONNECT_SERVER_IMAGE:-mdbase-connect-server:dev}
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile.server

x-hosted-provider-image: &hosted-provider-image
  image: ${MDBASE_CONNECT_HOSTED_PROVIDER_IMAGE:-mdbase-connect-hosted-provider:dev}
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile.hosted-provider

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mdbase_connect}
      POSTGRES_USER: ${POSTGRES_USER:-mdbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-this-password}
    volumes:
      - connect-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  relay-broker:
    image: ${MDBASE_CONNECT_NATS_IMAGE:-mdbase-connect-nats:dev}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.nats
    environment:
      PORT: 10000
      NATS_AUTH_TOKEN: ${MDBASE_CONNECT_RELAY_NATS_TOKEN:-replace-this-relay-token-with-at-least-32-characters}
    ports:
      - "127.0.0.1:${MDBASE_CONNECT_NATS_BIND_PORT:-4222}:4222"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:10000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  hosted-db:
    profiles: ["hosted"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mdbase_connect_hosted
      POSTGRES_USER: mdbase_hosted
      POSTGRES_PASSWORD: ${HOSTED_POSTGRES_PASSWORD:-replace-this-hosted-password}
    volumes:
      - connect-hosted-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  hosted-object-store:
    profiles: ["hosted"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MDBASE_CONNECT_R2_ACCESS_KEY_ID:-local-r2-access}
      MINIO_ROOT_PASSWORD: ${MDBASE_CONNECT_R2_SECRET_ACCESS_KEY:-local-r2-secret}
    volumes:
      - connect-hosted-objects:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  hosted-object-store-init:
    profiles: ["hosted"]
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      hosted-object-store:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://hosted-object-store:9000
        "$${MDBASE_CONNECT_R2_ACCESS_KEY_ID}" "$${MDBASE_CONNECT_R2_SECRET_ACCESS_KEY}" &&
        mc mb --ignore-existing local/$${MDBASE_CONNECT_R2_BUCKET}
    environment:
      MDBASE_CONNECT_R2_BUCKET: ${MDBASE_CONNECT_R2_BUCKET:-mdbase-connect-dev-files}
      MDBASE_CONNECT_R2_ACCESS_KEY_ID: ${MDBASE_CONNECT_R2_ACCESS_KEY_ID:-local-r2-access}
      MDBASE_CONNECT_R2_SECRET_ACCESS_KEY: ${MDBASE_CONNECT_R2_SECRET_ACCESS_KEY:-local-r2-secret}
    restart: "no"

  hosted-provider:
    profiles: ["hosted"]
    <<: *hosted-provider-image
    depends_on:
      hosted-db:
        condition: service_healthy
      hosted-object-store-init:
        condition: service_completed_successfully
    environment:
      HOST: 0.0.0.0
      PORT: 8790
      DATABASE_URL: postgres://mdbase_hosted:${HOSTED_POSTGRES_PASSWORD:-replace-this-hosted-password}@hosted-db:5432/mdbase_connect_hosted
      MDBASE_CONNECT_HOSTED_PROVIDER_INTERNAL_TOKEN: ${MDBASE_CONNECT_HOSTED_PROVIDER_INTERNAL_TOKEN:-local-hosted-provider-token-00000001}
      MDBASE_CONNECT_HOSTED_PROVIDER_MASTER_KEY: ${MDBASE_CONNECT_HOSTED_PROVIDER_MASTER_KEY:-bG9jYWwtZGV2ZWxvcG1lbnQtbWFzdGVyLWtleS0wMDE=}
      MDBASE_CONNECT_CONTROL_PLANE_URL: ${PUBLIC_URL:-http://127.0.0.1:8787}
      MDBASE_CONNECT_R2_ENDPOINT: ${MDBASE_CONNECT_R2_ENDPOINT:-http://hosted-object-store:9000}
      MDBASE_CONNECT_R2_BUCKET: ${MDBASE_CONNECT_R2_BUCKET:-mdbase-connect-dev-files}
      MDBASE_CONNECT_R2_ACCESS_KEY_ID: ${MDBASE_CONNECT_R2_ACCESS_KEY_ID:-local-r2-access}
      MDBASE_CONNECT_R2_SECRET_ACCESS_KEY: ${MDBASE_CONNECT_R2_SECRET_ACCESS_KEY:-local-r2-secret}
      MDBASE_CONNECT_ALLOW_INSECURE_R2: "true"
      MDBASE_CONNECT_INSECURE_R2_HOSTS: hosted-object-store
    ports:
      - "127.0.0.1:${MDBASE_CONNECT_HOSTED_PROVIDER_BIND_PORT:-8790}:8790"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8790/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    image: ${MDBASE_CONNECT_SERVER_IMAGE:-mdbase-connect-server:dev}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "services/server/dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mdbase}:${POSTGRES_PASSWORD:-replace-this-password}@postgres:5432/${POSTGRES_DB:-mdbase_connect}
    restart: "no"

  connect:
    <<: *connect-image
    depends_on:
      migrate:
        condition: service_completed_successfully
      relay-broker:
        condition: service_healthy
      hosted-provider:
        condition: service_healthy
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8787}
      DATABASE_URL: postgres://${POSTGRES_USER:-mdbase}:${POSTGRES_PASSWORD:-replace-this-password}@postgres:5432/${POSTGRES_DB:-mdbase_connect}
      MDBASE_CONNECT_DEV_AUTH: ${MDBASE_CONNECT_DEV_AUTH:-1}
      MDBASE_CONNECT_MANAGEMENT_ORIGINS: ${MDBASE_CONNECT_MANAGEMENT_ORIGINS:-http://127.0.0.1:5173}
      MDBASE_EDITOR_ORIGIN: ${MDBASE_EDITOR_ORIGIN:-http://127.0.0.1:5173}
      MDBASE_CONNECT_TAILSCALE_AUTH: ${MDBASE_CONNECT_TAILSCALE_AUTH:-0}
      MDBASE_CONNECT_GITHUB_CLIENT_ID: ${MDBASE_CONNECT_GITHUB_CLIENT_ID:-}
      MDBASE_CONNECT_GITHUB_CLIENT_SECRET: ${MDBASE_CONNECT_GITHUB_CLIENT_SECRET:-}
      MDBASE_CONNECT_ALLOWED_GITHUB_USER_IDS: ${MDBASE_CONNECT_ALLOWED_GITHUB_USER_IDS:-}
      MDBASE_CONNECT_GOOGLE_CLIENT_ID: ${MDBASE_CONNECT_GOOGLE_CLIENT_ID:-}
      MDBASE_CONNECT_ALLOWED_GOOGLE_SUBJECTS: ${MDBASE_CONNECT_ALLOWED_GOOGLE_SUBJECTS:-}
      MDBASE_CONNECT_REGISTRATION: ${MDBASE_CONNECT_REGISTRATION:-closed}
      MDBASE_CONNECT_AUTH_RATE_LIMIT_SECRET: ${MDBASE_CONNECT_AUTH_RATE_LIMIT_SECRET:-}
      MDBASE_CONNECT_TERMS_URL: ${MDBASE_CONNECT_TERMS_URL:-}
      MDBASE_CONNECT_PRIVACY_URL: ${MDBASE_CONNECT_PRIVACY_URL:-}
      MDBASE_CONNECT_HOSTED_COLLECTIONS: ${MDBASE_CONNECT_HOSTED_COLLECTIONS:-0}
      MDBASE_CONNECT_HOSTED_REFERENCE_AUTHORITY: ${MDBASE_CONNECT_HOSTED_REFERENCE_AUTHORITY:-0}
      MDBASE_CONNECT_HOSTED_PROVIDER_URL: ${MDBASE_CONNECT_HOSTED_PROVIDER_URL:-}
      MDBASE_CONNECT_HOSTED_PROVIDER_PUBLIC_URL: ${MDBASE_CONNECT_HOSTED_PROVIDER_PUBLIC_URL:-}
      MDBASE_CONNECT_HOSTED_PROVIDER_INTERNAL_TOKEN: ${MDBASE_CONNECT_HOSTED_PROVIDER_INTERNAL_TOKEN:-}
      MDBASE_CONNECT_ALLOW_INSECURE_HOSTED_PROVIDER: ${MDBASE_CONNECT_ALLOW_INSECURE_HOSTED_PROVIDER:-0}
      MDBASE_CONNECT_TRUST_PROXY: ${MDBASE_CONNECT_TRUST_PROXY:-0}
      MDBASE_CONNECT_ALLOW_INSECURE_MANIFESTS: ${MDBASE_CONNECT_ALLOW_INSECURE_MANIFESTS:-0}
      MDBASE_CONNECT_RELAY_NATS_URL: nats://relay-broker:4222
      MDBASE_CONNECT_RELAY_NATS_TOKEN: ${MDBASE_CONNECT_RELAY_NATS_TOKEN:-replace-this-relay-token-with-at-least-32-characters}
    ports:
      - "127.0.0.1:${MDBASE_CONNECT_BIND_PORT:-8787}:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  connect-postgres:
  connect-hosted-postgres:
  connect-hosted-objects:
