[package]
name = "mdbase-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mdbase"
path = "src/main.rs"

[dependencies]
clap.workspace = true
chrono-tz.workspace = true
iana-time-zone.workspace = true
mdbase-command = { path = "../../../mdbase-rs/crates/mdbase-command" }
mdbase-connect-daemon = { path = "../connect-agent" }
mdbase-connect-core = { path = "../connect-core" }
mdbase-connect-protocol = { path = "../connect-protocol" }
directories.workspace = true
fs2 = "0.4"
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tempfile.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
