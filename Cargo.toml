[workspace]
members = [
  "crates/connect-protocol",
  "crates/connect-core",
  "crates/connect-mirror",
  "crates/connect-agent",
  "crates/connect-cli",
  "crates/connect-hosted-provider",
  "crates/connect-runtime",
  "crates/connect-testbed-adapter",
]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.58"
edition = "2021"
license = "MIT"
repository = "https://github.com/mdbase-dev/mdbase-connect"

[workspace.dependencies]
aes-gcm = "0.11"
async-trait = "0.1"
aws-credential-types = "=1.2.14"
aws-config = { version = "=1.8.12", default-features = false, features = ["credentials-process", "default-https-client", "rt-tokio", "sso"] }
aws-sdk-kms = { version = "=1.110.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "=1.137.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
aws-smithy-types = "=1.5.0"
aws-types = "=1.3.16"
axum = "0.8.9"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"
directories = "6"
futures-util = "0.3"
hkdf = "0.12"
hmac = "0.12"
mdbase = { path = "../mdbase-rs" }
mdbase-interop = { version = "0.1.0-rc.2", git = "https://github.com/mdbase-dev/mdbase-spec.git", rev = "b133c8c24531d793e9ca0dbc93cb7a3b55d01776" }
mdbase-runtime = { path = "../mdbase-rs/crates/mdbase-runtime" }
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.1"
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "json", "chrono", "migrate", "macros"] }
subtle = "2.6.1"
jsonschema = { version = "0.18", features = ["draft202012"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "vendored", "crypto-rust"] }
p256 = { version = "0.13", features = ["ecdh"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.7.0", features = ["cors", "limit", "request-id", "trace"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
url = "2"
zeroize = { version = "1", features = ["derive"] }

[profile.profiling]
inherits = "release"
debug = 1
strip = false
