[package]
name = "mdbn-trust"
description = "Environment trust assets: the one parser/verifier of the NEXT release trust payload v1 and its normalized policy-pin output."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Authenticated LAB fixture tests require the separately supplied private asset.
# Default public-tree tests use the public synthetic vector only.
lab = []

# Allowed internal dependencies: mdbn-wire, mdbn-replica. The library does no I/O
# (the `mdbn-trust` binary reads one file for build steps). Not linked into
# runtime.wasm.
[dependencies]
mdbn-wire.workspace = true
mdbn-replica.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"

[lints]
workspace = true
