[package]
name = "mdbn-core"
description = "The pure, deterministic mdbase core: semantics with no I/O (native and WASM)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Allowed dependencies: no internal crates. External crates must be pure Rust, build
# for wasm32-unknown-unknown without host imports, and must not pull in getrandom,
# libc or the `regex` crate (`regex-lite` is the decided flavour). Checked by
# `cargo xtask arch`.
[dependencies]
# SHA-256 for revisions, digests and the generated-value MAC. Pure Rust, no_std.
sha2 = { version = "0.10", default-features = false }
# The regex profile (spec 10): one engine on every platform.
regex-lite.workspace = true
# Decode the embedded, pinned tzdb. Pure Rust; same features as replica/sim.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[lints]
workspace = true

[dev-dependencies]
# Test oracle for the compact NFC/NFD in `unicode` (never a runtime dependency).
unicode-normalization.workspace = true
# Differential testing of the YAML profile parser only; never a runtime dependency.
yaml-rust2.workspace = true
