[package]
name = "mdbase"
description = "mdbase: typed Markdown collections. Open a folder of Markdown files with YAML frontmatter and read, query (CEL), validate and write records through one safe engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
keywords = ["markdown", "frontmatter", "notes", "yaml", "database"]
categories = ["database", "text-processing"]
readme = "README.md"

# Allowed internal dependencies: mdbn-core, mdbn-wire, mdbn-replica,
# mdbn-store-file, mdbn-platform-native, mdbn-local-host. A composition point:
# nothing depends on it except mdbase-node.
[dependencies]
mdbn-core.workspace = true
mdbn-wire.workspace = true
mdbn-replica.workspace = true
mdbn-store-file.workspace = true
mdbn-local-host.workspace = true
serde_json.workspace = true

