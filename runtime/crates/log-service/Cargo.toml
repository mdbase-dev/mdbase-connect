[package]
name = "mdbn-log-service"
description = "The blind log service: conditional append per collection, snapshots, blobs, push. Never sees plaintext."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Allowed internal dependencies: mdbn-wire ONLY. Depending on core or replica would let it read plaintext semantics; the arch check forbids it.
# The crate is platform-neutral: it builds natively (Postgres gateway) and for
# wasm32-unknown-unknown (the Durable Object). No tokio, no clock, no OS entropy:
# hosts pass time and randomness in.
[dependencies]
mdbn-wire.workspace = true
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
ed25519-dalek = { version = "2.2", default-features = false, features = ["fast", "zeroize"] }
async-lock = "3"

[lints]
workspace = true
