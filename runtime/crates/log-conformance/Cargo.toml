[package]
name = "mdbn-log-conformance"
description = "Conformance suite and benchmarks for the log service contract, run over the wire against any backend (memory, Postgres, Durable Objects)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Allowed internal dependencies: mdbn-wire, mdbn-log-service (testkit, error codes), mdbn-log-server (in-process targets for tests).
[dependencies]
mdbn-wire.workspace = true
mdbn-log-service.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false }
getrandom = { version = "0.3", default-features = false }

[dev-dependencies]
tokio-postgres = "0.7"
mdbn-log-server = { workspace = true, features = ["test-support"] }

[features]
# TLS for remote targets (wss://, https://), e.g. a deployed Worker.
tls = ["tokio-tungstenite/native-tls", "reqwest/native-tls"]

[lints]
workspace = true
