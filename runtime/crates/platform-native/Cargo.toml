[package]
name = "mdbn-platform-native"
description = "FilePlatform for real filesystems (Linux, macOS, Windows) and the native IndexStorage and Journal on SQLite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Allowed internal dependencies: mdbn-store-file (the traits it implements), mdbn-core. Native only; may use std::fs and OS APIs.
[dependencies]
mdbn-core.workspace = true
mdbn-store-file.workspace = true
rusqlite = { version = "0.37", features = ["bundled", "hooks"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }

[dev-dependencies]
# Native test allocation oracles only; never a production dependency.
allocation-counter = "=0.8.1"
# Seeded query oracle only; never a production dependency.
mdbn-conformance = { path = "../conformance" }
mdbn-store-file = { workspace = true, features = ["testing"] }

[features]
default = ["sqlite"]
# The SQLite IndexStorage/Journal. Its bundled C build needs a C toolchain for
# the target, so CI's cross-target FFI check builds without it.
sqlite = ["dep:rusqlite"]

[[test]]
name = "native"
required-features = ["sqlite"]

[lints]
workspace = true
