[package]
name = "mdbn-daemon"
description = "The native desktop daemon and the `mdbase` CLI: hosts device replicas, the embedded local log service, local IPC and the relay connection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Allowed internal dependencies: mdbn-core, mdbn-wire, mdbn-replica,
# mdbn-store-file, mdbn-platform-native, mdbn-local-host, mdbn-log-service,
# mdbn-legacy, mdbn-takeover, mdbn-noise, mdbn-trust. This is a composition
# point: it wires stores to replicas. Native only; never linked into WASM.

[features]
# A LAB build: embeds the LAB environment's trust asset and signs in only to the
# LAB control plane. Both authenticated trust/lab.json and
# trust/lab-release-manifest.json must be supplied; missing files are a compile
# error. Default production builds need neither file and never enable LAB.
lab = ["mdbn-trust/lab"]

[[bin]]
name = "mdbase"
path = "src/main.rs"

[dependencies]
mdbn-wire.workspace = true
mdbn-replica.workspace = true
mdbn-trust.workspace = true
# The shared native composition of a collection folder (store, host lock, host
# services) for the collection runtime.
mdbn-local-host.workspace = true
mdbn-core.workspace = true
mdbn-store-file.workspace = true
mdbn-platform-native.workspace = true
mdbn-legacy.workspace = true
mdbn-takeover.workspace = true
mdbn-noise.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.47", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal", "process"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter", "ansi"] }
getrandom = { version = "0.3", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
sha2 = "0.10"
semver = "1"
time = { version = "0.3", features = ["parsing", "formatting"] }
hmac = "0.12"
ring = "0.17"
base64 = "0.22"
serde_jcs = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
# Shared, zero-copy bodies for direct object PUT retries (log-service-api §6).
bytes = "1"
zeroize = "1"
# Native folder watcher (inotify / FSEvents / ReadDirectoryChangesW) for sub-second
# ingest; the periodic rescan stays as the safety net.
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
# Hidden password entry for `mdbase private` (AK1).
rpassword = "7"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "vendored", "crypto-rust"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
dbus-crossroads = "0.5"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }
winit = { version = "0.30", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
notify-rust = { version = "4.18", default-features = false, features = ["z-with-tokio"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Old connector state fixtures for the takeover tests (same version as mdbn-legacy).
rusqlite = { version = "0.37", features = ["bundled"] }
# Test tooling only (tests/sync_pair.rs, examples): the real log service, in memory,
# with the deterministic test control plane.
mdbn-log-service.workspace = true
# Paused-clock tests for the session lifetime.
tokio = { version = "1.47", features = ["test-util"] }

[lints]
workspace = true

# The log service's real transport for tests/sync_pair.rs (dev only; the log
# server builds on Unix hosts only).
[target.'cfg(unix)'.dev-dependencies]
mdbn-log-server.workspace = true
