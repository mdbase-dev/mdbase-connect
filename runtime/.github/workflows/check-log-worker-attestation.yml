name: Log Worker attestation regressions
on:
  # On demand only: run before a LAB refresh or release candidate.
  workflow_dispatch:

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test scripts/attest-log-worker.test.mjs
      - run: python3 scripts/test-extract-log-worker.py
