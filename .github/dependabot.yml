version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-development:
        dependency-type: development
      npm-production:
        dependency-type: production
    open-pull-requests-limit: 10

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      rust-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      workflow-actions:
        patterns:
          - "*"
    ignore:
      # desktop-release.yml pins 6.0.9: 6.1.0 cannot bootstrap pnpm 11.15.1 on
      # Intel macOS (ERR_PNPM_PNPM_ENGINE_IDENTITY_UNVERIFIABLE). Remove once a
      # release passes the macOS Intel jobs.
      - dependency-name: pnpm/action-setup
        versions: [">= 6.1.0"]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
      day: monday
    groups:
      container-images:
        patterns:
          - "*"
    open-pull-requests-limit: 5
