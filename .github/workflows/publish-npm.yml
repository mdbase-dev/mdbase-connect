name: Publish npm packages

on:
  workflow_run:
    workflows: [Server CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '47 */6 * * *'
  pull_request:
    paths:
      - .github/workflows/publish-npm.yml
      - scripts/continuous-sdk-release.mjs
      - scripts/lib/continuous-*-release*
      - scripts/lib/client-publication.test.mjs
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan, verify and pack only
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

# Tag runs publish one at a time, in reservation order. The main coordinator has
# its own group, so it never displaces a pending tag run.
concurrency:
  group: npm-publication-${{ github.event_name == 'pull_request' && github.ref || startsWith(github.ref, 'refs/tags/') && 'live' || 'coordinator' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SDK_RELEASE_STOPPED: ${{ vars.SDK_RELEASE_STOPPED }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: node --test scripts/lib/continuous-client-release.test.mjs scripts/lib/continuous-sdk-release.test.mjs

  plan:
    needs: validate
    # On main: coordinate. On a coordinator-reserved v0.1.0-beta.N tag: publish
    # that tag's commit, which is this run's own commit.
    if: >-
      github.repository == 'mdbase-dev/mdbase-connect' &&
      ((github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))) ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v0.1.0-beta.')))
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      changed: ${{ steps.plan.outputs.changed }}
      reserve: ${{ steps.plan.outputs.reserve }}
      artifact_run_id: ${{ steps.plan.outputs.artifact_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - name: Prefetch pinned Electron through authenticated release assets
        uses: ./.github/actions/prefetch-electron
        with:
          token: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:npm-bootstrap
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_PUBLICATION: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
          PUBLICATION_ACKNOWLEDGED_RUN: ${{ vars.NPM_RELEASE_ACKNOWLEDGED_RUN }}
        run: node scripts/continuous-sdk-release.mjs plan workspace "$RUNNER_TEMP/npm-release-plan.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: npm-release-plan
          path: ${{ runner.temp }}/npm-release-plan.json
          if-no-files-found: error

  reserve:
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.reserve == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: npm-release-plan
          path: ${{ runner.temp }}/npm-plan
      - name: Reserve the release tag at the selected production commit and publish from it
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/continuous-sdk-release.mjs reserve "$RUNNER_TEMP/npm-plan/npm-release-plan.json"

  pack:
    needs: plan
    if: startsWith(github.ref, 'refs/tags/v0.1.0-beta.') && needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: npm-release-plan
          path: ${{ runner.temp }}/npm-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: qualified-npm-packages
          path: ${{ runner.temp }}/qualified-packages
          run-id: ${{ needs.plan.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - run: node scripts/continuous-sdk-release.mjs pack-workspace "$RUNNER_TEMP/npm-plan/npm-release-plan.json" "$RUNNER_TEMP/qualified-packages" "$RUNNER_TEMP/npm-packages"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: versioned-npm-packages
          path: ${{ runner.temp }}/npm-packages/*.tgz
          if-no-files-found: error

  publish:
    name: Publish changed SDK packages
    needs: [plan, pack]
    if: startsWith(github.ref, 'refs/tags/v0.1.0-beta.') && needs.plan.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11
      - run: node scripts/check-release-readiness.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: npm-release-plan
          path: ${{ runner.temp }}/npm-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: versioned-npm-packages
          path: ${{ runner.temp }}/npm-packages
      - name: Publish qualified package bytes with CI versions and OIDC provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci/verify-qualified-commit "$GITHUB_SHA"
          node scripts/continuous-sdk-release.mjs compatible
          node scripts/continuous-sdk-release.mjs publish-workspace "$RUNNER_TEMP/npm-plan/npm-release-plan.json" "$RUNNER_TEMP/npm-packages"
