name: Publish npm packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: qualification
        name: Require exact full Server CI qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/verify-qualified-commit "$GITHUB_SHA"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an npm version with trusted publishing support
        run: npm install --global npm@11

      - name: Validate tag
        id: release
        run: |
          VERSION="$(node --print "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v${VERSION}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match workspace version v${VERSION}"
            exit 1
          fi
          case "$VERSION" in
            *-*) DIST_TAG="next" ;;
            *) DIST_TAG="latest" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify trusted-publisher bootstrap
        run: pnpm check:npm-bootstrap

      - run: pnpm version:check

      - name: Enforce release-readiness gates
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          case "$VERSION" in
            *-*) pnpm check:release-readiness ;;
            *) pnpm check:release-readiness -- --stable ;;
          esac

      - run: pnpm check:architecture

      - name: Download qualified package tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-npm-packages
          path: ${{ runner.temp }}/npm-packages
          run-id: ${{ steps.qualification.outputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Publish packages
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          while IFS=$'\t' read -r PACKAGE_NAME PACKAGE_DIR; do
            if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$PACKAGE_NAME@$VERSION is already published; skipping"
              continue
            fi

            SAFE_NAME="${PACKAGE_NAME#@}"
            SAFE_NAME="${SAFE_NAME/\//-}"
            npm publish "$RUNNER_TEMP/npm-packages/${SAFE_NAME}-${VERSION}.tgz" \
              --access public \
              --tag "$DIST_TAG"
          done < <(node scripts/public-packages.mjs)
