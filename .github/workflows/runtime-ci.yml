# Existing runtime source qualification; no credentials, signing or deployment.
name: Runtime CI
on:
  pull_request:
    paths: ['runtime/**', '.github/workflows/runtime-ci.yml', '.github/workflows/runtime-native-tests.yml', '.github/workflows/release-workers.yml', 'scripts/release-workers*.mjs', 'scripts/ci/runtime-reuse.mjs']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: runtime-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    working-directory: runtime
env:
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: '10'
  WRANGLER_SEND_METRICS: 'false'
jobs:
  classify:
    name: Select Runtime CI reuse
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      tree: ${{ steps.reuse.outputs.tree }}
      runtime_inputs_sha256: ${{ steps.reuse.outputs.runtime_inputs_sha256 }}
      reused_run_id: ${{ steps.reuse.outputs.reused_run_id }}
      native_reused_run_id: ${{ steps.reuse.outputs.native_reused_run_id }}
      run_native: ${{ steps.reuse.outputs.run_native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - id: reuse
        name: Reuse verified Runtime CI and native results for the exact tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/runtime-reuse.mjs classify-runtime

  publication:
    name: Worker publication contract
    needs: classify
    if: needs.classify.outputs.reused_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify publisher authorization, trust hold and ops publication contract
        working-directory: .
        run: node --test scripts/release-workers.test.mjs

  native:
    needs: classify
    if: needs.classify.outputs.run_native == 'true'
    uses: ./.github/workflows/runtime-native-tests.yml

  wasm:
    name: wasm (build, size budget, determinism)
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Reuse verified Runtime CI result
        if: needs.classify.outputs.reused_run_id != ''
        working-directory: .
        run: echo "Reused verified Runtime CI run ${{ needs.classify.outputs.reused_run_id }} (inputs ${{ needs.classify.outputs.runtime_inputs_sha256 }})"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.classify.outputs.reused_run_id == ''
      - name: Install pinned toolchain (rust-toolchain.toml)
        if: needs.classify.outputs.reused_run_id == ''
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.classify.outputs.reused_run_id == ''
        with:
          workspaces: runtime -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.classify.outputs.reused_run_id == ''
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            runtime/tools/wasm/package-lock.json
            runtime/packages/sdk/package-lock.json
            runtime/tools/browser-smokes/package-lock.json
      - name: Install pinned wasm-opt (binaryen)
        if: needs.classify.outputs.reused_run_id == ''
        run: npm ci --prefix tools/wasm --no-audit --no-fund
      - name: clippy for wasm32, portable crates (-D warnings)
        if: needs.classify.outputs.reused_run_id == ''
        run: >-
          cargo clippy --locked --target wasm32-unknown-unknown
          -p mdbn-core -p mdbn-wire -p mdbn-replica -p mdbn-store-file -p mdbn-wasm
          -p mdbn-log-service -p mdbase-wasm
          -- -D warnings
      - name: build runtime.wasm (wasm-release + wasm-opt -Oz)
        if: needs.classify.outputs.reused_run_id == ''
        run: cargo xtask wasm
      - name: size report regressions (no size gate)
        if: needs.classify.outputs.reused_run_id == ''
        run: node --test scripts/wasm-size.test.mjs
      - name: size report (no size gate)
        if: needs.classify.outputs.reused_run_id == ''
        run: cargo xtask wasm-size
      - name: determinism (native vs WASM replay)
        if: needs.classify.outputs.reused_run_id == ''
        run: cargo xtask determinism
      - name: dedicated app runtime (feature tests, wasm32 clippy, size report, real SQLite ABI)
        if: needs.classify.outputs.reused_run_id == ''
        # Same path remapping as publish-sdk-npm.yml, so this build is byte-identical
        # to the WASM the SDK publisher packs and can be checked against the SDK pin.
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/source --remap-path-prefix=/home/runner/.cargo=/cargo
        run: cargo xtask wasm-app
      - name: Record optimized WASM sizes
        id: performance_wasm
        continue-on-error: true
        if: needs.classify.outputs.reused_run_id == '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node ../scripts/performance-report.mjs --wasm runtime=target/wasm/runtime.wasm --wasm app-runtime=target/wasm/app-runtime.wasm --out "$RUNNER_TEMP/wasm-sizes.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.classify.outputs.reused_run_id == '' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.performance_wasm.outcome == 'success'
        continue-on-error: true
        with:
          name: performance-wasm-sizes
          path: ${{ runner.temp }}/wasm-sizes.json
          retention-days: 90
          if-no-files-found: error
      - name: Publish WASM size history
        if: needs.classify.outputs.reused_run_id == '' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.performance_wasm.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/post-performance
        with:
          report: ${{ runner.temp }}/wasm-sizes.json
          token: ${{ secrets.OPS_BENCHMARK_TOKEN }}
      - name: Install isolated browser smoke tooling
        if: needs.classify.outputs.reused_run_id == ''
        run: |
          npm ci --prefix tools/browser-smokes --no-audit --no-fund
          npm exec --prefix tools/browser-smokes -- playwright install --with-deps chromium
      - name: Native SDK and browser custody smokes
        if: needs.classify.outputs.reused_run_id == ''
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/runtime/tools/browser-smokes/node_modules/playwright/index.mjs
        run: |
          mkdir -p target/app-handover-ci
          cargo test --locked -p mdbn-replica handover_production_fixture_for_app_smoke -- --nocapture > target/app-handover-ci/test.log
          node packages/sdk/scripts/prepare-app-handover-fixture.mjs target/app-handover-ci/test.log target/app-handover-ci
          timeout 120s node packages/sdk/scripts/app-runtime-smoke.mjs target/wasm/app-runtime.wasm
          timeout 120s node packages/sdk/scripts/app-handover-smoke.mjs target/wasm/app-runtime.wasm target/app-handover-ci/fixture.cbor target/app-handover-ci/policy-pins.cbor
          timeout 120s node packages/sdk/scripts/app-noise-idb-smoke.mjs target/wasm/app-runtime.wasm
          timeout 120s node packages/sdk/scripts/app-device-key-custody-smoke.mjs target/wasm/app-runtime.wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.classify.outputs.reused_run_id == ''
        with:
          name: runtime-wasm
          path: |
            runtime/target/wasm/runtime.wasm
            runtime/target/wasm/app-runtime.wasm
          retention-days: 7
      - name: SDK runtime pin matches this build
        if: needs.classify.outputs.reused_run_id == ''
        working-directory: .
        run: node scripts/sdk-publication.mjs check-runtime-pin

  sdk:
    name: sdk execution
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: runtime/packages/sdk
    steps:
      - name: Reuse verified Runtime CI result
        if: needs.classify.outputs.reused_run_id != ''
        working-directory: .
        run: echo "Reused verified Runtime CI run ${{ needs.classify.outputs.reused_run_id }} (inputs ${{ needs.classify.outputs.runtime_inputs_sha256 }})"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.classify.outputs.reused_run_id == ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.classify.outputs.reused_run_id == ''
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            runtime/packages/sdk/package-lock.json
            runtime/tools/wasm/package-lock.json
            runtime/tools/browser-smokes/package-lock.json
      - name: Install pinned toolchain (rust-toolchain.toml)
        if: needs.classify.outputs.reused_run_id == ''
        working-directory: runtime
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.classify.outputs.reused_run_id == ''
        with:
          workspaces: runtime -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned wasm-opt (binaryen)
        if: needs.classify.outputs.reused_run_id == ''
        working-directory: runtime
        run: npm ci --prefix tools/wasm --no-audit --no-fund
      - name: Build required SDK integration runtime and trust verifier
        if: needs.classify.outputs.reused_run_id == ''
        working-directory: runtime
        run: cargo xtask wasm && cargo build -p mdbn-trust --locked
      - name: Managed native trust compiler-input regressions (real shared verifier)
        if: needs.classify.outputs.reused_run_id == ''
        working-directory: runtime
        run: node --test scripts/build-managed-native-trust.test.mjs
      - name: Native staging artifact custody regressions (synthetic custody only)
        if: needs.classify.outputs.reused_run_id == ''
        working-directory: runtime
        run: node --test scripts/native-staging-artifact.test.mjs
      - name: install
        if: needs.classify.outputs.reused_run_id == ''
        run: npm ci --no-audit --no-fund
      - name: typecheck
        if: needs.classify.outputs.reused_run_id == ''
        run: npm run typecheck
      - name: build
        if: needs.classify.outputs.reused_run_id == ''
        run: npm run build
      - name: Record packed SDK size
        id: performance_sdk
        continue-on-error: true
        if: needs.classify.outputs.reused_run_id == '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-performance"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/sdk-performance"
          node ../../../scripts/performance-report.mjs --sdk-package "$RUNNER_TEMP"/sdk-performance/*.tgz --out "$RUNNER_TEMP/sdk-sizes.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.classify.outputs.reused_run_id == '' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.performance_sdk.outcome == 'success'
        continue-on-error: true
        with:
          name: performance-sdk-sizes
          path: ${{ runner.temp }}/sdk-sizes.json
          retention-days: 90
          if-no-files-found: error
      - name: Publish SDK size history
        if: needs.classify.outputs.reused_run_id == '' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.performance_sdk.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/post-performance
        with:
          report: ${{ runner.temp }}/sdk-sizes.json
          token: ${{ secrets.OPS_BENCHMARK_TOKEN }}
      - name: tests (incl. conformance/wire golden fixtures)
        if: needs.classify.outputs.reused_run_id == ''
        run: npm test
      - name: Managed application packaging (real shared verifier; synthetic custody only)
        if: needs.classify.outputs.reused_run_id == ''
        run: node --test scripts/production-application.node-test.mjs
      - name: cold npm consumers (normal pack, empty install roots and caches)
        if: needs.classify.outputs.reused_run_id == ''
        run: npm run check:npm-consumer
      - name: Browser storage and lifecycle smokes
        if: needs.classify.outputs.reused_run_id == ''
        working-directory: runtime
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/runtime/tools/browser-smokes/node_modules/playwright/index.mjs
        run: |
          npm ci --prefix tools/browser-smokes --no-audit --no-fund
          npm exec --prefix tools/browser-smokes -- playwright install --with-deps chromium
          node --test packages/sdk/scripts/prepare-app-handover-fixture.node-test.mjs
          for smoke in app-storage app-sqlite app-owner keys-mv3 app-private-persistence app-cloud-copy-outcome app-embedded-host; do
            timeout 120s node "packages/sdk/scripts/$smoke-smoke.mjs"
          done
      - name: bundle boundaries
        if: needs.classify.outputs.reused_run_id == ''
        run: npm run bundle-boundaries

  obsidian:
    name: obsidian runtime execution
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: runtime/packages/obsidian-runtime
    steps:
      - name: Reuse verified Runtime CI result
        if: needs.classify.outputs.reused_run_id != ''
        working-directory: .
        run: echo "Reused verified Runtime CI run ${{ needs.classify.outputs.reused_run_id }} (inputs ${{ needs.classify.outputs.runtime_inputs_sha256 }})"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.classify.outputs.reused_run_id == ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.classify.outputs.reused_run_id == ''
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            runtime/packages/sdk/package-lock.json
            runtime/packages/obsidian-runtime/package-lock.json
      - name: build SDK storage dependency
        if: needs.classify.outputs.reused_run_id == ''
        working-directory: runtime/packages/sdk
        run: npm ci --no-audit --no-fund && npm run build
      - name: install
        if: needs.classify.outputs.reused_run_id == ''
        run: npm ci --no-audit --no-fund
      - name: typecheck
        if: needs.classify.outputs.reused_run_id == ''
        run: npm run typecheck
      - name: tests
        if: needs.classify.outputs.reused_run_id == ''
        run: npm test
      - name: build
        if: needs.classify.outputs.reused_run_id == ''
        run: npm run build

  hosted-worker:
    name: Hosted worker
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runtime/deploy/hosted-worker
    steps:
      - name: Reuse verified Runtime CI result
        if: needs.classify.outputs.reused_run_id != ''
        working-directory: .
        run: echo "Reused verified Runtime CI run ${{ needs.classify.outputs.reused_run_id }} (inputs ${{ needs.classify.outputs.runtime_inputs_sha256 }})"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.classify.outputs.reused_run_id == ''

      # hosted.wasm and the public app fixture are pure functions of the Rust
      # sources, so reuse them while those are unchanged and skip cargo entirely.
      - name: Restore hosted.wasm and public fixture (keyed by Rust sources)
        id: wasm-cache
        if: needs.classify.outputs.reused_run_id == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            runtime/deploy/hosted-worker/hosted.wasm
            runtime/deploy/hosted-worker/.ci/fixture.json
          key: hosted-worker-wasm-v1-${{ hashFiles('runtime/crates/**', 'runtime/conformance/**', 'runtime/Cargo.toml', 'runtime/Cargo.lock', 'runtime/rust-toolchain.toml', 'runtime/.cargo/**', '.github/workflows/runtime-ci.yml') }}

      - name: Install pinned toolchain (rust-toolchain.toml)
        if: needs.classify.outputs.reused_run_id == '' && steps.wasm-cache.outputs.cache-hit != 'true'
        working-directory: runtime
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.classify.outputs.reused_run_id == '' && steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          workspaces: runtime -> target
          shared-key: hosted-worker
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Same command as build-wasm.sh, with local cargo instead of the remote builder.
      - name: Build hosted.wasm (wasm32, wasm-release)
        if: needs.classify.outputs.reused_run_id == '' && steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          cargo build --locked --target wasm32-unknown-unknown --profile wasm-release -p mdbn-hosted-worker
          cp ../../target/wasm32-unknown-unknown/wasm-release/mdbn_hosted_worker.wasm hosted.wasm
      - name: Generate the public fixed-value app fixture (lab_fixture 0e app)
        if: needs.classify.outputs.reused_run_id == '' && steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci
          cargo run --quiet --locked -p mdbn-hosted-worker --example lab_fixture -- 0e app > .ci/fixture.json

      - name: Fixture manifest and WASM digest
        if: needs.classify.outputs.reused_run_id == ''
        run: |
          sha256sum hosted.wasm .ci/fixture.json
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs");
            const sha256 = require("node:crypto").createHash("sha256").update(readFileSync(".ci/fixture.json")).digest("hex");
            writeFileSync(".ci/fixture.manifest.json", JSON.stringify({ publicFixedTestValuesOnly: true, managedCompositionQualified: false, sha256 }));
          '

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.classify.outputs.reused_run_id == ''
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: runtime/deploy/hosted-worker/package-lock.json
      - name: install (pinned workerd, wrangler, esbuild)
        if: needs.classify.outputs.reused_run_id == ''
        run: npm ci --no-audit --no-fund

      - name: tests (node + workerd; no skips allowed)
        if: needs.classify.outputs.reused_run_id == ''
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/hosted-worker-test.log"
          # A missing hosted.wasm turns tests into skips, not failures.
          grep -Eq '^(#|ℹ) skipped 0$' "$RUNNER_TEMP/hosted-worker-test.log" || { echo "::error::hosted worker tests were skipped"; exit 1; }

      - name: upload failed-run evidence
        if: failure() && needs.classify.outputs.reused_run_id == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hosted-worker-test-state
          path: runtime/deploy/hosted-worker/.test-state/
          if-no-files-found: ignore
          retention-days: 7
  conformance:
    name: logsvc DO (wasm32, local conformance, restart replay)
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_NET_RETRY: '10'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Reuse verified Runtime CI result
        if: needs.classify.outputs.reused_run_id != ''
        working-directory: .
        run: echo "Reused verified Runtime CI run ${{ needs.classify.outputs.reused_run_id }} (inputs ${{ needs.classify.outputs.runtime_inputs_sha256 }})"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.classify.outputs.reused_run_id == ''
      - name: Install pinned toolchain
        if: needs.classify.outputs.reused_run_id == ''
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.classify.outputs.reused_run_id == ''
        with:
          workspaces: |
            runtime -> target
            runtime/deploy/cloudflare-do -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        if: needs.classify.outputs.reused_run_id == ''
        with:
          tool: worker-build@0.8.7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.classify.outputs.reused_run_id == ''
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: runtime/deploy/cloudflare-do/package-lock.json
      - name: Install pinned Wrangler
        if: needs.classify.outputs.reused_run_id == ''
        run: npm ci --prefix deploy/cloudflare-do --no-audit --no-fund
      - name: DO rustfmt
        if: needs.classify.outputs.reused_run_id == ''
        run: cargo fmt --manifest-path deploy/cloudflare-do/Cargo.toml --check
      - name: Prefetch worker-build release tools through authenticated assets
        if: needs.classify.outputs.reused_run_id == ''
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/prefetch-worker-tools.mjs .
      - name: Build Worker (wasm32)
        if: needs.classify.outputs.reused_run_id == ''
        working-directory: runtime/deploy/cloudflare-do
        run: worker-build --release --locked
      - name: Build wire conformance client
        if: needs.classify.outputs.reused_run_id == ''
        run: cargo build --locked -p mdbn-log-conformance --bin logsvc-bench
      - name: Local DO conformance and restart regression
        if: needs.classify.outputs.reused_run_id == ''
        working-directory: runtime/deploy/cloudflare-do
        env:
          LOGSVC_BENCH: ../../target/debug/logsvc-bench
        run: npm test
      - name: Bundle checksums and source revision
        if: needs.classify.outputs.reused_run_id == ''
        working-directory: runtime/deploy/cloudflare-do
        run: |
          git rev-parse HEAD > build/SOURCE_REVISION
          cp wrangler.jsonc build/wrangler.jsonc
          python3 -B - <<'PY'
          import json, os, pathlib
          source = pathlib.Path("build/SOURCE_REVISION").read_text().strip()
          assert source == os.environ["GITHUB_SHA"]
          metadata = {
              "schema": "mdbase-next-log-worker-build/1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": "runtime-ci.yml",
              "source_revision": source,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }
          pathlib.Path("build/BUILD.json").write_text(json.dumps(metadata, sort_keys=True) + "\n")
          PY
          cd build
          sha256sum index.js index_bg.wasm package.json worker/shim.mjs SOURCE_REVISION BUILD.json wrangler.jsonc > SHA256SUMS
      - name: Upload tested Worker bundle (unsigned; ops attests/releases)
        if: needs.classify.outputs.reused_run_id == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: logsvc-do-worker-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/deploy/cloudflare-do/build/index.js
            runtime/deploy/cloudflare-do/build/index_bg.wasm
            runtime/deploy/cloudflare-do/build/package.json
            runtime/deploy/cloudflare-do/build/worker/shim.mjs
            runtime/deploy/cloudflare-do/build/SOURCE_REVISION
            runtime/deploy/cloudflare-do/build/BUILD.json
            runtime/deploy/cloudflare-do/build/wrangler.jsonc
            runtime/deploy/cloudflare-do/build/SHA256SUMS
          retention-days: 14
      - name: Runtime diagnostics on failure
        if: failure() && needs.classify.outputs.reused_run_id == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: logsvc-do-runtime-diagnostics
          include-hidden-files: true
          path: runtime/deploy/cloudflare-do/.wrangler/runtime-test-*/wrangler.log
          retention-days: 7

  record-qualification:
    name: Record Runtime CI qualification
    needs: [classify, publication, wasm, sdk, obsidian, hosted-worker, conformance]
    if: needs.classify.outputs.reused_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - id: receipt
        name: Record immutable Runtime CI qualification receipt
        run: node scripts/ci/runtime-reuse.mjs write-runtime-receipt "$RUNNER_TEMP/runtime-qualification.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.receipt.outputs.artifact_name }}
          path: ${{ runner.temp }}/runtime-qualification.json
          if-no-files-found: error
          retention-days: 90
