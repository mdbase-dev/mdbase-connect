name: Native runtime tests
on:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    working-directory: runtime
env:
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: '10'
jobs:
  native:
    name: native tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: workspace
            packages: --workspace --exclude mdbn-daemon --exclude mdbn-replica
          - shard: replica
            packages: -p mdbn-replica
          - shard: daemon
            packages: -p mdbn-daemon
          # The staging artifact embeds only public in-repo trust, so CI builds
          # and tests that exact profile too.
          - shard: daemon-staging
            packages: -p mdbn-daemon --features staging
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mdbn
          POSTGRES_PASSWORD: mdbn
          POSTGRES_DB: mdbn_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mdbn" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime -> target
          shared-key: native-${{ matrix.shard }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run library, binary, integration and documentation tests
        env:
          MDBN_TEST_PG_URL: host=127.0.0.1 port=5432 user=mdbn password=mdbn dbname=mdbn_test
          # store-pg's schema tests fail instead of skipping if the URL above goes missing.
          MDBN_TEST_PG_REQUIRED: '1'
        run: cargo test --locked ${{ matrix.packages }}
      # `pnpm e2e`: the test build above already holds the daemon binaries it runs.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: matrix.shard == 'daemon'
        with:
          version: 11.15.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.shard == 'daemon'
        with:
          node-version: 24
          cache: pnpm
      - name: Runtime daemon request path (pnpm e2e)
        if: matrix.shard == 'daemon'
        working-directory: .
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter '@mdbase/connect-server...' build
          node test/system/run.mjs --suite runtime-daemon --no-prepare
      - name: Staging cannot combine with LAB or local-rehearsal
        if: matrix.shard == 'daemon-staging'
        run: |
          for features in staging,lab staging,local-rehearsal; do
            if cargo check --locked -p mdbn-daemon --features "$features" 2> exclusive.log; then
              echo "--features $features compiled" >&2
              exit 1
            fi
            grep -q 'distinct artifacts; choose exactly one' exclusive.log
          done
