name: Diagnose Windows CLI heap corruption

on:
  push:
    branches: [diag/windows-cli-heap]

permissions:
  contents: read

jobs:
  loop:
    name: CLI lifecycle loop ${{ matrix.shard }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c, d]
    defaults:
      run:
        working-directory: mdbase-connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mdbase-connect
          persist-credentials: false
      - id: engine
        shell: bash
        run: echo "revision=$(tr -d '\r\n' < deploy/docker/mdbase-rs-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: callumalpass/mdbase-rs
          ref: ${{ steps.engine.outputs.revision }}
          path: mdbase-rs
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup override set 1.94.0
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            mdbase-connect -> target
          shared-key: connect-debug-${{ steps.engine.outputs.revision }}
          save-if: false
      - name: Build the CLI
        shell: pwsh
        run: |
          cargo build --locked -p mdbase-cli
          if ($LASTEXITCODE -ne 0) { throw 'CLI build failed.' }
      - name: Enable crash dumps
        shell: pwsh
        run: |
          $dumps = Join-Path $PWD '.artifacts\heap'
          New-Item -ItemType Directory -Force $dumps | Out-Null
          $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\mdbase.exe'
          New-Item -Force $wer | Out-Null
          New-ItemProperty -Force $wer -Name DumpFolder -PropertyType ExpandString -Value $dumps | Out-Null
          New-ItemProperty -Force $wer -Name DumpType -PropertyType DWord -Value 2 | Out-Null
          New-ItemProperty -Force $wer -Name DumpCount -PropertyType DWord -Value 20 | Out-Null
          Test-Path 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
      - name: Loop the lifecycle
        run: node scripts/diagnostics/windows-cli-stop-hammer.mjs target/debug/mdbase.exe 200
      - name: Analyse dumps
        if: always()
        shell: pwsh
        run: |
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          $symbols = "srv*D:\sym*https://msdl.microsoft.com/download/symbols;$PWD\target\debug;$PWD\target\debug\deps"
          Get-ChildItem .artifacts\heap
          foreach ($dump in Get-ChildItem .artifacts\heap -Filter *.dmp | Select-Object -First 6) {
            Write-Output "===== $($dump.Name)"
            & $cdb -z $dump.FullName -y $symbols -c '.reload /f; !analyze -v; .ecxr; kP 80; ~*kb 50; q' 2>&1 | Select-Object -Last 600
          }
      - name: Upload dumps
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heap-dumps-${{ matrix.shard }}
          path: |
            mdbase-connect/.artifacts/heap
            mdbase-connect/target/debug/mdbase.exe
            mdbase-connect/target/debug/mdbase.pdb
          if-no-files-found: warn
          retention-days: 5
