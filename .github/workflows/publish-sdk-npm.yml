name: Publish source-built SDK

on:
  workflow_run:
    workflows: [Server CI, Runtime CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '37 */6 * * *'
  pull_request:
    paths:
      - .github/workflows/publish-sdk-npm.yml
      - .github/workflows/publish-runtime-npm.yml
      - config/release-components*
      - config/next-trust/**
      - scripts/**sdk-publication*
      - scripts/publish-sdk-prerelease*
      - scripts/lib/sdk-publication*
      - scripts/lib/sdk-prerelease*
      - scripts/continuous-sdk-release.mjs
      - scripts/public-packages.mjs
      - scripts/lib/npm-build-provenance*
      - scripts/lib/continuous-*-release*
      - scripts/lib/client-publication.test.mjs
      - runtime/packages/sdk/**
      - runtime/crates/**
      - runtime/Cargo.toml
      - runtime/Cargo.lock
      - runtime/rust-toolchain.toml
      - runtime/.cargo/**
      - runtime/xtask/**
      - runtime/tools/wasm/**
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, verify and pack only; never publish by default
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sdk-publication-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLICATION_RUN_COMMIT: ${{ github.sha }}
  SDK_RELEASE_STOPPED: ${{ vars.SDK_RELEASE_STOPPED }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --test scripts/lib/sdk-publication.test.mjs scripts/lib/sdk-prerelease.test.mjs scripts/lib/continuous-client-release.test.mjs scripts/lib/continuous-sdk-release.test.mjs scripts/lib/npm-build-provenance.test.mjs
      - run: node scripts/sdk-publication.mjs check

  plan:
    needs: validate
    if: >-
      github.repository == 'mdbase-dev/mdbase-connect' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      changed: ${{ steps.plan.outputs.changed }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - name: Prefetch pinned Electron through authenticated release assets
        uses: ./.github/actions/prefetch-electron
        with:
          token: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_PUBLICATION: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
          PUBLICATION_ACKNOWLEDGED_RUN: ${{ vars.SDK_RELEASE_ACKNOWLEDGED_RUN }}
        run: node scripts/continuous-sdk-release.mjs plan source "$RUNNER_TEMP/sdk-release-plan.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sdk-release-plan
          path: ${{ runner.temp }}/sdk-release-plan.json
          if-no-files-found: error

  build:
    needs: [validate, plan]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (github.event_name == 'pull_request' || needs.plan.outputs.changed == 'true') }}
    env:
      CLIENT_RELEASE_COMMIT: ${{ needs.plan.outputs.commit || github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit || github.sha }}
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Refuse a release before the runtime port is qualified
        if: github.event_name != 'pull_request'
        run: |
          export GITHUB_SHA="$CLIENT_RELEASE_COMMIT"
          node scripts/sdk-publication.mjs ready
      - name: Require exact release qualification before publication
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GITHUB_SHA="$CLIENT_RELEASE_COMMIT"
          node "$GITHUB_WORKSPACE/.release-tools/scripts/continuous-sdk-release.mjs" compatible
          scripts/ci/verify-qualified-commit "$GITHUB_SHA"
          node "$GITHUB_WORKSPACE/.release-tools/scripts/continuous-sdk-release.mjs" runtime-ci
      - name: Install pinned build tools
        run: |
          export GITHUB_SHA="$CLIENT_RELEASE_COMMIT"
          (cd runtime && rustup toolchain install && rustup show active-toolchain)
          npm ci --prefix runtime/tools/wasm --ignore-scripts
          npm ci --prefix runtime/packages/sdk --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: github.event_name != 'pull_request'
        with:
          name: sdk-release-plan
          path: ${{ runner.temp }}/sdk-plan
      - name: Apply the CI version only in this build checkout
        if: github.event_name != 'pull_request'
        run: |
          export GITHUB_SHA="$CLIENT_RELEASE_COMMIT"
          node "$GITHUB_WORKSPACE/.release-tools/scripts/continuous-sdk-release.mjs" prepare-source "$RUNNER_TEMP/sdk-plan/sdk-release-plan.json"
      - name: Build verifier and application runtime from this commit
        working-directory: runtime
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/source --remap-path-prefix=/home/runner/.cargo=/cargo
        run: |
          export GITHUB_SHA="$CLIENT_RELEASE_COMMIT"
          cargo test --locked -p mdbn-trust
          cargo build --locked --release -p mdbn-trust --bin mdbn-trust
          cargo xtask wasm-app
      - name: Compile, cold-test and verify all three environment archives from the same WASM
        run: |
          export GITHUB_SHA="$CLIENT_RELEASE_COMMIT"
          node scripts/sdk-publication.mjs pack-all "$RUNNER_TEMP/sdk-packages"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-built-sdks
          path: ${{ runner.temp }}/sdk-packages/*.tgz
          if-no-files-found: error

  publish:
    name: Publish source-built SDK
    needs: [build, plan]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
    env:
      CLIENT_RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
    runs-on: ubuntu-24.04
    environment: npm-sdk
    outputs:
      state: ${{ steps.publication.outputs.state }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: |
          export GITHUB_SHA="$CLIENT_RELEASE_COMMIT"
          node scripts/sdk-publication.mjs ready
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sdk-release-plan
          path: ${{ runner.temp }}/sdk-plan
      - run: |
          export GITHUB_SHA="$CLIENT_RELEASE_COMMIT"
          node "$GITHUB_WORKSPACE/.release-tools/scripts/continuous-sdk-release.mjs" prepare-source "$RUNNER_TEMP/sdk-plan/sdk-release-plan.json"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-built-sdks
          path: ${{ runner.temp }}/sdk-packages
      - run: |
          export GITHUB_SHA="$CLIENT_RELEASE_COMMIT"
          node scripts/sdk-publication.mjs verify-npm "$RUNNER_TEMP/sdk-packages/sdk-production.tgz"
      - name: Record workflow identity and production build source
        run: |
          export GITHUB_SHA="$CLIENT_RELEASE_COMMIT"
          node "$GITHUB_WORKSPACE/.release-tools/scripts/continuous-sdk-release.mjs" attestation-predicate "$RUNNER_TEMP/sdk-predicate.json"
      - uses: actions/attest@daf44fb950173508f38bd2406030372c1d1162b1 # v3.0.0
        with:
          subject-path: ${{ runner.temp }}/sdk-packages/sdk-production.tgz
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/sdk-predicate.json
      - run: |
          export GITHUB_SHA="$CLIENT_RELEASE_COMMIT"
          npm install --global npm@11
      - name: Recheck qualified source, production compatibility and publication state
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          export GITHUB_SHA="$CLIENT_RELEASE_COMMIT"
          scripts/ci/verify-qualified-commit "$GITHUB_SHA"
          node "$GITHUB_WORKSPACE/.release-tools/scripts/continuous-sdk-release.mjs" runtime-ci
          node "$GITHUB_WORKSPACE/.release-tools/scripts/continuous-sdk-release.mjs" compatible
          node "$GITHUB_WORKSPACE/.release-tools/scripts/continuous-sdk-release.mjs" publication-state @mdbase-dev/sdk "$SDK_VERSION"
      - name: Publish the verified production archive with provenance
        if: steps.publication.outputs.state == 'absent'
        run: |
          export GITHUB_SHA="$CLIENT_RELEASE_COMMIT"
          node "$GITHUB_WORKSPACE/.release-tools/scripts/continuous-sdk-release.mjs" publish-archive \
            @mdbase-dev/sdk "${{ needs.plan.outputs.version }}" "$RUNNER_TEMP/sdk-packages/sdk-production.tgz"

  attest-internal:
    needs: [build, plan]
    env:
      CLIENT_RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .release-tools
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: source-built-sdks
          path: ${{ runner.temp }}/sdk-packages
      - name: Record workflow identity and production build source
        run: |
          export GITHUB_SHA="$CLIENT_RELEASE_COMMIT"
          node "$GITHUB_WORKSPACE/.release-tools/scripts/continuous-sdk-release.mjs" attestation-predicate "$RUNNER_TEMP/sdk-predicate.json"
      - id: staging
        uses: actions/attest@daf44fb950173508f38bd2406030372c1d1162b1 # v3.0.0
        with:
          subject-path: ${{ runner.temp }}/sdk-packages/sdk-staging.tgz
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/sdk-predicate.json
      - id: lab
        uses: actions/attest@daf44fb950173508f38bd2406030372c1d1162b1 # v3.0.0
        with:
          subject-path: ${{ runner.temp }}/sdk-packages/sdk-lab.tgz
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/sdk-predicate.json
      - name: Stage the exact attested assets and verification bundles
        env:
          STAGING_BUNDLE: ${{ steps.staging.outputs.bundle-path }}
          LAB_BUNDLE: ${{ steps.lab.outputs.bundle-path }}
        run: |
          mkdir "$RUNNER_TEMP/sdk-internal"
          cp "$RUNNER_TEMP/sdk-packages/sdk-staging.tgz" "$RUNNER_TEMP/sdk-internal/"
          cp "$RUNNER_TEMP/sdk-packages/sdk-lab.tgz" "$RUNNER_TEMP/sdk-internal/"
          cp "$STAGING_BUNDLE" "$RUNNER_TEMP/sdk-internal/sdk-staging.tgz.sigstore.json"
          cp "$LAB_BUNDLE" "$RUNNER_TEMP/sdk-internal/sdk-lab.tgz.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: attested-internal-sdks
          path: ${{ runner.temp }}/sdk-internal/*
          if-no-files-found: error

  publish-internal:
    # Only after the verified production publish, so a dry or failed
    # run never consumes a prerelease tag.
    needs: [attest-internal, publish, plan]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) && needs.publish.outputs.state == 'absent'
    env:
      CLIENT_RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sdk-release-plan
          path: ${{ runner.temp }}/sdk-plan
      - run: |
          export GITHUB_SHA="$CLIENT_RELEASE_COMMIT"
          node "$GITHUB_WORKSPACE/.release-tools/scripts/continuous-sdk-release.mjs" prepare-source "$RUNNER_TEMP/sdk-plan/sdk-release-plan.json"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: attested-internal-sdks
          path: ${{ runner.temp }}/sdk-internal
      - name: Create an SDK prerelease without replacing existing assets or Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GITHUB_SHA="$CLIENT_RELEASE_COMMIT"
          node "$GITHUB_WORKSPACE/.release-tools/scripts/continuous-sdk-release.mjs" compatible
          node scripts/publish-sdk-prerelease.mjs "$RUNNER_TEMP/sdk-internal"
