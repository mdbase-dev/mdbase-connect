name: Publish Server Images

on:
  workflow_run:
    workflows:
      - Server CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full release commit to rebuild and attest
        required: true
        type: string
      release_tag:
        description: Annotated release tag that must resolve to source_commit
        required: true
        type: string
      reason:
        description: Audit reason for republishing unchanged runtime inputs
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-server-images-${{ github.event_name == 'workflow_dispatch' && inputs.source_commit || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  SOURCE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.source_commit || github.event.workflow_run.head_sha }}

jobs:
  changes:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.diff.outputs.publish }}
      component_matrix: ${{ steps.release.outputs.component_matrix }}
      qualification_run_id: ${{ steps.release.outputs.qualification_run_id }}
      qualification_run_attempt: ${{ steps.release.outputs.qualification_run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 2
          fetch-tags: true
          persist-credentials: false

      - id: qualification
        name: Verify exact Server CI qualification
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            scripts/ci/verify-qualified-commit "$SOURCE_COMMIT" "$UPSTREAM_RUN_ID"
          else
            scripts/ci/verify-qualified-commit "$SOURCE_COMMIT"
          fi

      - id: release
        name: Load the canonical release contract
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ steps.qualification.outputs.run_id }}
        run: |
          matrix=$(node scripts/release-components.mjs --github-matrix)
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID")
          attempt=$(jq -er '.run_attempt | select(. >= 1)' <<<"$run")
          {
            echo "component_matrix=$matrix"
            echo "qualification_run_id=$QUALIFICATION_RUN_ID"
            echo "qualification_run_attempt=$attempt"
          } >>"$GITHUB_OUTPUT"

      - id: diff
        name: Detect managed runtime changes
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]
            test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$SOURCE_COMMIT"
            test -n "$REPUBLISH_REASON"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          parent=$(git rev-parse "$SOURCE_COMMIT^")
          if git diff --quiet "$parent" "$SOURCE_COMMIT" -- \
            Cargo.toml \
            apps/portal \
            config \
            crates \
            deploy/docker/Cargo.lock.hosted-provider \
            deploy/docker/Dockerfile.hosted-provider \
            deploy/docker/Dockerfile.client \
            deploy/docker/Dockerfile.mcp \
            deploy/docker/Dockerfile.server \
            deploy/docker/mdbase-rs-revision \
            package.json \
            packages/client \
            packages/protocol \
            packages/sync \
            packages/ui \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            services/mcp \
            services/server
          then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPUBLISH_REASON: ${{ inputs.reason }}

  publish:
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    name: Publish ${{ matrix.component }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.component_matrix) }}
    env:
      IMAGE: ghcr.io/mdbase-dev/${{ matrix.package }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false

      - id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Restore hosted-provider Cargo cache mounts
        if: matrix.component == 'hosted-provider'
        id: hosted-provider-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: hosted-provider-cache-mounts
          key: hosted-provider-cargo-${{ hashFiles('deploy/docker/Cargo.lock.hosted-provider', 'deploy/docker/mdbase-rs-revision') }}-${{ env.SOURCE_COMMIT }}
          restore-keys: |
            hosted-provider-cargo-${{ hashFiles('deploy/docker/Cargo.lock.hosted-provider', 'deploy/docker/mdbase-rs-revision') }}-

      - name: Inject hosted-provider Cargo cache mounts
        if: matrix.component == 'hosted-provider'
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: hosted-provider-cache-mounts
          dockerfile: deploy/docker/Dockerfile.hosted-provider
          skip-extraction: ${{ steps.hosted-provider-cache.outputs.cache-hit }}

      - name: Restore client Cargo cache mounts
        if: matrix.component == 'client'
        id: client-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: client-cache-mounts
          key: client-cargo-${{ hashFiles('deploy/docker/Cargo.lock.hosted-provider', 'deploy/docker/mdbase-rs-revision') }}-${{ env.SOURCE_COMMIT }}
          restore-keys: |
            client-cargo-${{ hashFiles('deploy/docker/Cargo.lock.hosted-provider', 'deploy/docker/mdbase-rs-revision') }}-

      - name: Inject client Cargo cache mounts
        if: matrix.component == 'client'
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: client-cache-mounts
          dockerfile: deploy/docker/Dockerfile.client
          skip-extraction: ${{ steps.client-cache.outputs.cache-hit }}

      - id: build
        name: Build and push immutable image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ env.SOURCE_COMMIT }}
          build-args: MDBASE_CONNECT_REVISION=${{ env.SOURCE_COMMIT }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}
          provenance: mode=max
          sbom: true

      - name: Smoke-test the published client image
        if: matrix.component == 'client'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          expected=$(jq -r .version package.json)
          actual=$(docker run --rm "$IMAGE@$DIGEST" --version)
          grep -F -- "$expected" <<<"$actual"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image and attest its release identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: |
          image_ref="$IMAGE@$DIGEST"
          cosign sign --yes "$image_ref"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$SOURCE_COMMIT" \
            --arg component "$COMPONENT" \
            --arg image "$IMAGE" \
            '{
              repository:$repository,
              commit:$commit,
              component:$component,
              image:$image
            }' > "$RUNNER_TEMP/release-image.json"
          cosign attest \
            --yes \
            --type https://mdbase.dev/attestations/release-image/v1 \
            --predicate "$RUNNER_TEMP/release-image.json" \
            "$image_ref"

      - name: Record published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: |
          jq -n \
            --arg component "$COMPONENT" \
            --arg commit "$SOURCE_COMMIT" \
            --arg image "$IMAGE@$DIGEST" \
            '{component:$component, commit:$commit, image:$image}' \
            > "$RUNNER_TEMP/$COMPONENT.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-image-${{ matrix.component }}
          path: ${{ runner.temp }}/${{ matrix.component }}.json
          if-no-files-found: error
          retention-days: 90

  release-bundle:
    needs: [changes, publish]
    if: needs.changes.outputs.publish == 'true'
    name: Sign immutable release bundle
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-image-*
          path: ${{ runner.temp }}/release-components
          merge-multiple: true

      - name: Build the exact-commit release bundle
        run: >-
          node scripts/release-components.mjs
          --build-bundle "$RUNNER_TEMP/release-bundle.json"
          --components-dir "$RUNNER_TEMP/release-components"
          --commit "$SOURCE_COMMIT"
          --qualification-run-id "${{ needs.changes.outputs.qualification_run_id }}"
          --qualification-run-attempt "${{ needs.changes.outputs.qualification_run_attempt }}"
          --publication-run-id "$GITHUB_RUN_ID"
          --publication-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the release bundle with the publishing workflow identity
        run: >-
          cosign sign-blob --yes
          --bundle "$RUNNER_TEMP/release-bundle.sigstore.json"
          "$RUNNER_TEMP/release-bundle.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: |
            ${{ runner.temp }}/release-bundle.json
            ${{ runner.temp }}/release-bundle.sigstore.json
          if-no-files-found: error
          retention-days: 90
