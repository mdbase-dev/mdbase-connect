name: Publish Server Images

on:
  workflow_run:
    workflows:
      - Server CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full release commit to rebuild and attest
        required: true
        type: string
      release_tag:
        description: Annotated release tag that must resolve to source_commit
        required: true
        type: string
      reason:
        description: Audit reason for republishing unchanged runtime inputs
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-server-images-${{ github.event_name == 'workflow_dispatch' && inputs.source_commit || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  SOURCE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.source_commit || github.event.workflow_run.head_sha }}

jobs:
  changes:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.diff.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 2
          fetch-tags: true
          persist-credentials: false

      - id: diff
        name: Detect managed runtime changes
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]
            test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$SOURCE_COMMIT"
            test -n "$REPUBLISH_REASON"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          parent=$(git rev-parse "$SOURCE_COMMIT^")
          if git diff --quiet "$parent" "$SOURCE_COMMIT" -- \
            Cargo.toml \
            apps/portal \
            crates \
            deploy/docker/Cargo.lock.hosted-provider \
            deploy/docker/Dockerfile.hosted-provider \
            deploy/docker/Dockerfile.mcp \
            deploy/docker/Dockerfile.server \
            deploy/docker/mdbase-rs-revision \
            package.json \
            packages/client \
            packages/protocol \
            packages/sync \
            packages/ui \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            services/mcp \
            services/server
          then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPUBLISH_REASON: ${{ inputs.reason }}

  publish:
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    name: Publish ${{ matrix.component }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: connect
            package: mdbase-connect-server
            dockerfile: deploy/docker/Dockerfile.server
          - component: hosted-provider
            package: mdbase-connect-hosted-provider
            dockerfile: deploy/docker/Dockerfile.hosted-provider
          - component: mcp
            package: mdbase-connect-mcp
            dockerfile: deploy/docker/Dockerfile.mcp
    env:
      IMAGE: ghcr.io/mdbase-dev/${{ matrix.package }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: build
        name: Build and push immutable image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ env.SOURCE_COMMIT }}
          build-args: MDBASE_CONNECT_REVISION=${{ env.SOURCE_COMMIT }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image and attest its release identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: |
          image_ref="$IMAGE@$DIGEST"
          cosign sign --yes "$image_ref"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$SOURCE_COMMIT" \
            --arg component "$COMPONENT" \
            --arg image "$IMAGE" \
            '{
              repository:$repository,
              commit:$commit,
              component:$component,
              image:$image
            }' > "$RUNNER_TEMP/release-image.json"
          cosign attest \
            --yes \
            --type https://mdbase.dev/attestations/release-image/v1 \
            --predicate "$RUNNER_TEMP/release-image.json" \
            "$image_ref"

      - name: Record published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: |
          jq -n \
            --arg component "$COMPONENT" \
            --arg commit "$SOURCE_COMMIT" \
            --arg image "$IMAGE@$DIGEST" \
            '{component:$component, commit:$commit, image:$image}' \
            > "$RUNNER_TEMP/$COMPONENT.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-image-${{ matrix.component }}
          path: ${{ runner.temp }}/${{ matrix.component }}.json
          if-no-files-found: error
          retention-days: 90
