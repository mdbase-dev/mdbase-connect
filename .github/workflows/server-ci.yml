name: Server CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-filesystem:
    name: Windows filesystem safety
    runs-on: windows-2025
    defaults:
      run:
        working-directory: mdbase-connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mdbase-connect
      - id: mdbase_revision
        shell: bash
        run: echo "revision=$(tr -d '\r\n' < deploy/docker/mdbase-rs-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: callumalpass/mdbase-rs
          ref: ${{ steps.mdbase_revision.outputs.revision }}
          path: mdbase-rs
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup override set 1.94.0
      - run: cargo test --locked -p mdbase-connect-core -p mdbase-connect-daemon
        env:
          MDBASE_CONNECT_ENV: test
          MDBASE_CONNECT_SECRET_BACKEND: insecure-test-file

  runtime-testbed:
    name: Runtime interoperability testbed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mdbase-connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mdbase-connect
      - id: mdbase_revision
        run: echo "revision=$(tr -d '\r\n' < deploy/docker/mdbase-rs-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: callumalpass/mdbase-rs
          ref: ${{ steps.mdbase_revision.outputs.revision }}
          path: mdbase-rs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mdbase-dev/mdbase-spec
          ref: fe1f0c854a58565a2dc6499505f95d3294ce314a
          path: mdbase-spec
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: rustup override set 1.94.0
      - name: Install portable testbed runner
        working-directory: mdbase-spec/packages/testbed
        run: npm ci
      - name: Exercise the Connect notification runtime
        run: >-
          node ../mdbase-spec/packages/testbed/src/cli.mjs run
          --adapter command:cargo
          --adapter-arg run
          --adapter-arg --locked
          --adapter-arg --quiet
          --adapter-arg -p
          --adapter-arg mdbase-connect-testbed-adapter
          --adapter-arg --
          --scenario runtime.application-execution
          --timeout-ms 120000

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm check:release-readiness
      - run: pnpm audit:dependencies
      - run: pnpm check:architecture
      # Workspace packages publish their declarations from dist, so build the
      # dependency graph before checking downstream consumers.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm package:audit

  server-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: docker build --file deploy/docker/Dockerfile.server --tag mdbase-connect-server:test .
      - run: docker build --file deploy/docker/Dockerfile.hosted-provider --tag mdbase-connect-hosted-provider:test .
      - run: docker build --file deploy/docker/Dockerfile.nats --tag mdbase-connect-nats:test .
      - run: MDBASE_CONNECT_E2E_BUILD=0 node scripts/container-e2e.mjs

  previous-release-upgrade:
    name: Previous release upgrade and OAuth
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mdbase_connect_upgrade
          POSTGRES_USER: mdbase
          POSTGRES_PASSWORD: previous-release-upgrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mdbase -d mdbase_connect_upgrade"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://mdbase:previous-release-upgrade@127.0.0.1:5432/mdbase_connect_upgrade
      CANDIDATE_IMAGE: mdbase-connect-server:upgrade-candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build candidate server
        run: >-
          docker build
          --file deploy/docker/Dockerfile.server
          --tag "$CANDIDATE_IMAGE"
          .

      - name: Create the previous release schema
        run: |
          . .github/previous-release.env
          docker pull "$MDBASE_CONNECT_PREVIOUS_SERVER_IMAGE"
          docker run --rm --network host \
            --env DATABASE_URL \
            "$MDBASE_CONNECT_PREVIOUS_SERVER_IMAGE" \
            node services/server/dist/migrate.js

      - name: Upgrade with candidate migrations
        run: |
          docker run --rm --network host \
            --env DATABASE_URL \
            "$CANDIDATE_IMAGE" \
            node services/server/dist/migrate.js

      - name: Exercise the upgraded OAuth authorization write path
        run: |
          cleanup() {
            docker logs mdbase-connect-upgrade-candidate || true
            docker rm --force mdbase-connect-upgrade-candidate >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name mdbase-connect-upgrade-candidate \
            --network host \
            --env DATABASE_URL \
            --env PUBLIC_URL=http://127.0.0.1:8787 \
            --env MDBASE_CONNECT_DEV_AUTH=1 \
            --env MDBASE_CONNECT_ALLOW_INSECURE_MANIFESTS=1 \
            "$CANDIDATE_IMAGE" >/dev/null

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/ready >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "Candidate server did not become ready." >&2
              exit 1
            fi
            sleep 2
          done

          registration=$(curl --fail --silent --show-error \
            --header 'content-type: application/json' \
            --data '{"manifest":{"manifest_version":1,"id":"dev.mdbase.release-canary","name":"Release canary","homepage":"http://127.0.0.1:8787","redirect_uris":["http://127.0.0.1:8787/callback"],"requirements":{"contracts":[],"access":"full_collection"}}}' \
            http://127.0.0.1:8787/v1/apps/register)
          application_id=$(jq --raw-output '.application.id' <<<"$registration")
          manifest_digest=$(jq --raw-output '.application.manifest_digest' <<<"$registration")
          test -n "$application_id"
          [[ "$manifest_digest" =~ ^[a-f0-9]{64}$ ]]

          cookie_jar="$RUNNER_TEMP/oauth-cookie"
          curl --fail --silent --show-error \
            --cookie-jar "$cookie_jar" \
            --header 'content-type: application/json' \
            --data '{"name":"Release canary","email":"release-canary@example.com"}' \
            http://127.0.0.1:8787/v1/dev/session >/dev/null
          authorization=$(docker run --rm "$CANDIDATE_IMAGE" \
            node packages/protocol/scripts/create-release-canary-authorization.mjs \
            "$application_id" "$manifest_digest")
          authorization_id=$(jq --raw-output '.authorization_id' <<<"$authorization")
          authorization_uri=$(curl --fail --silent --show-error \
            --header 'content-type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$(jq --raw-output '.form.client_id' <<<"$authorization")" \
            --data-urlencode "redirect_uri=$(jq --raw-output '.form.redirect_uri' <<<"$authorization")" \
            --data-urlencode "code_challenge=$(jq --raw-output '.form.code_challenge' <<<"$authorization")" \
            --data-urlencode 'code_challenge_method=S256' \
            --data-urlencode "state=$(jq --raw-output '.form.state' <<<"$authorization")" \
            --data-urlencode "operations=$(jq --raw-output '.form.operations' <<<"$authorization")" \
            --data-urlencode "application_authorization=$(jq --compact-output '.form.application_authorization | fromjson' <<<"$authorization")" \
            http://127.0.0.1:8787/oauth/authorization_request |
            jq --raw-output '.authorization_uri')
          [[ "$authorization_uri" == "http://127.0.0.1:8787/oauth/authorize?request_id=$authorization_id" ]]
          location=$(curl --silent --show-error \
            --cookie "$cookie_jar" \
            --output /dev/null \
            --write-out '%{redirect_url}' \
            "$authorization_uri")
          [[ "$location" == "http://127.0.0.1:8787/authorize/$authorization_id" ]]

  previous-provider-upgrade:
    name: Previous provider notification recovery
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mdbase_provider_upgrade
          POSTGRES_USER: mdbase
          POSTGRES_PASSWORD: previous-provider-upgrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mdbase -d mdbase_provider_upgrade"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://mdbase:previous-provider-upgrade@127.0.0.1:5432/mdbase_provider_upgrade
      CANDIDATE_IMAGE: mdbase-connect-hosted-provider:upgrade-candidate
      PROVIDER_INTERNAL_TOKEN: previous-provider-upgrade-internal-token
      PROVIDER_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      MDBASE_CONNECT_R2_ENDPOINT: http://127.0.0.1:9000
      MDBASE_CONNECT_R2_BUCKET: upgrade-canary
      MDBASE_CONNECT_R2_ACCESS_KEY_ID: upgrade-canary
      MDBASE_CONNECT_R2_SECRET_ACCESS_KEY: upgrade-canary-secret
      MDBASE_CONNECT_ALLOW_INSECURE_R2: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build candidate provider
        run: >-
          docker build
          --file deploy/docker/Dockerfile.hosted-provider
          --tag "$CANDIDATE_IMAGE"
          .

      - name: Start test-only R2 readiness stub
        run: |
          node --input-type=module --eval '
            import { createServer } from "node:http";
            createServer((_request, response) => {
              response.writeHead(200);
              response.end();
            }).listen(9000, "127.0.0.1");
          ' >"$RUNNER_TEMP/mdbase-upgrade-r2.log" 2>&1 &
          r2_pid=$!
          echo "$r2_pid" >"$RUNNER_TEMP/mdbase-upgrade-r2.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000 >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$r2_pid" >/dev/null 2>&1 || [ "$attempt" = 30 ]; then
              cat "$RUNNER_TEMP/mdbase-upgrade-r2.log"
              exit 1
            fi
            sleep 1
          done

      - name: Create the previous provider schema
        run: |
          . .github/previous-release.env
          docker pull "$MDBASE_CONNECT_PREVIOUS_PROVIDER_IMAGE"
          docker run --detach --name mdbase-provider-previous \
            --network host \
            --env DATABASE_URL \
            --env MDBASE_CONNECT_HOSTED_PROVIDER_INTERNAL_TOKEN="$PROVIDER_INTERNAL_TOKEN" \
            --env MDBASE_CONNECT_HOSTED_PROVIDER_MASTER_KEY="$PROVIDER_MASTER_KEY" \
            --env MDBASE_CONNECT_R2_ENDPOINT \
            --env MDBASE_CONNECT_R2_BUCKET \
            --env MDBASE_CONNECT_R2_ACCESS_KEY_ID \
            --env MDBASE_CONNECT_R2_SECRET_ACCESS_KEY \
            --env MDBASE_CONNECT_ALLOW_INSECURE_R2 \
            "$MDBASE_CONNECT_PREVIOUS_PROVIDER_IMAGE" >/dev/null
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8790/ready >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker logs mdbase-provider-previous
              exit 1
            fi
            sleep 2
          done
          docker rm --force mdbase-provider-previous >/dev/null

      - name: Seed the persisted previous release notification shape
        run: |
          docker run --rm --interactive --network host \
            --env PGPASSWORD=previous-provider-upgrade \
            postgres:18-alpine \
            psql --host 127.0.0.1 --username mdbase --dbname mdbase_provider_upgrade \
            --set ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO hosted_provider_collections
            (id, template, spec_version, max_records, max_content_bytes,
             max_document_bytes, max_replicas, resource_revision,
             wrapped_data_key, resources_ciphertext)
          VALUES
            ('11111111-1111-4111-8111-111111111111', 'mdbase', '0.3',
             100, 1000000, 100000, 10, 'legacy', '\x00', '\x00');

          INSERT INTO hosted_provider_notification_grants
            (grant_id, collection_id, grant_json)
          VALUES (
            '22222222-2222-4222-8222-222222222222',
            '11111111-1111-4111-8111-111111111111',
            '{
              "id":"22222222-2222-4222-8222-222222222222",
              "application_id":"33333333-3333-4333-8333-333333333333",
              "application_name":"Upgrade canary",
              "application_homepage":"https://example.test",
              "application_origin":"https://example.test",
              "collection_id":"11111111-1111-4111-8111-111111111111",
              "collection_name":"Upgrade canary",
              "operations":["changes"],
              "scope":{"contracts":[],"access":"full_collection"},
              "notification_criteria":[{
                "id":"task.reminder",
                "event":{"id":"mdbase.runtime.timer.fired","version":"1.0.0"},
                "presentation":{"title":"Task reminder"}
              }],
              "created_at":"2026-07-29T00:00:00Z"
            }'::jsonb
          );
          SQL

      - name: Reopen persisted state with the previous release
        run: |
          . .github/previous-release.env
          docker run --detach --name mdbase-provider-previous-migration \
            --network host \
            --env DATABASE_URL \
            --env MDBASE_CONNECT_HOSTED_PROVIDER_INTERNAL_TOKEN="$PROVIDER_INTERNAL_TOKEN" \
            --env MDBASE_CONNECT_HOSTED_PROVIDER_MASTER_KEY="$PROVIDER_MASTER_KEY" \
            --env MDBASE_CONNECT_R2_ENDPOINT \
            --env MDBASE_CONNECT_R2_BUCKET \
            --env MDBASE_CONNECT_R2_ACCESS_KEY_ID \
            --env MDBASE_CONNECT_R2_SECRET_ACCESS_KEY \
            --env MDBASE_CONNECT_ALLOW_INSECURE_R2 \
            "$MDBASE_CONNECT_PREVIOUS_PROVIDER_IMAGE" >/dev/null
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8790/ready >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker logs mdbase-provider-previous-migration
              exit 1
            fi
            sleep 2
          done
          docker rm --force mdbase-provider-previous-migration >/dev/null

          previous_contract=$(docker run --rm --network host \
            --env PGPASSWORD=previous-provider-upgrade \
            postgres:18-alpine \
            psql --host 127.0.0.1 --username mdbase --dbname mdbase_provider_upgrade \
            --set ON_ERROR_STOP=1 \
            --tuples-only --no-align \
            --command "SELECT concat(
                         grant_json #>> '{notification_criteria,0,event,id}',
                         '|',
                         grant_json #>> '{notification_criteria,0,event,version}'
                       )
                       FROM hosted_provider_notification_grants
                       WHERE grant_id = '22222222-2222-4222-8222-222222222222'")
          echo "Previous release notification contract: $previous_contract"
          [[ "$previous_contract" == "mdbase.runtime.timer.fired|1.0.0" ]]

      - name: Require candidate recovery readiness
        run: |
          cleanup() {
            docker logs mdbase-provider-upgrade-candidate || true
            docker rm --force mdbase-provider-upgrade-candidate >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name mdbase-provider-upgrade-candidate \
            --network host \
            --env DATABASE_URL \
            --env MDBASE_CONNECT_HOSTED_PROVIDER_INTERNAL_TOKEN="$PROVIDER_INTERNAL_TOKEN" \
            --env MDBASE_CONNECT_HOSTED_PROVIDER_MASTER_KEY="$PROVIDER_MASTER_KEY" \
            --env MDBASE_CONNECT_CONTROL_PLANE_URL=http://127.0.0.1:9 \
            --env MDBASE_CONNECT_R2_ENDPOINT \
            --env MDBASE_CONNECT_R2_BUCKET \
            --env MDBASE_CONNECT_R2_ACCESS_KEY_ID \
            --env MDBASE_CONNECT_R2_SECRET_ACCESS_KEY \
            --env MDBASE_CONNECT_ALLOW_INSECURE_R2 \
            "$CANDIDATE_IMAGE" >/dev/null

          for attempt in {1..30}; do
            readiness=$(curl --silent http://127.0.0.1:8790/ready || true)
            if jq -e '
              .status == "ready" and
              .notifications.configured == true and
              .notifications.recovery == "ok" and
              .notifications.consecutive_failures == 0
            ' <<<"$readiness" >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "Candidate provider did not recover upgraded notification state." >&2
              exit 1
            fi
            sleep 2
          done

          contract=$(docker run --rm --network host \
            --env PGPASSWORD=previous-provider-upgrade \
            postgres:18-alpine \
            psql --host 127.0.0.1 --username mdbase --dbname mdbase_provider_upgrade \
            --set ON_ERROR_STOP=1 \
            --tuples-only --no-align \
            --command "SELECT concat(
                         grant_json #>> '{notification_criteria,0,event,id}',
                         '|',
                         grant_json #>> '{notification_criteria,0,event,version}'
                       )
                       FROM hosted_provider_notification_grants
                       WHERE grant_id = '22222222-2222-4222-8222-222222222222'")
          echo "Recovered notification contract: $contract"
          [[ "$contract" == "mdbase.runtime.timer.fired|1.0.0" ]]

      - name: Stop test-only R2 readiness stub
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/mdbase-upgrade-r2.pid" ]; then
            r2_pid=$(<"$RUNNER_TEMP/mdbase-upgrade-r2.pid")
            kill "$r2_pid" >/dev/null 2>&1 || true
          fi

  hosted-provider:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mdbase-connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mdbase-connect
      - id: mdbase_revision
        run: echo "revision=$(tr -d '\r\n' < deploy/docker/mdbase-rs-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: callumalpass/mdbase-rs
          ref: ${{ steps.mdbase_revision.outputs.revision }}
          path: mdbase-rs
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mdbase-connect/pnpm-lock.yaml
      - run: >-
          rustup toolchain install 1.94.0
          --profile minimal
          --component rustfmt
          --component clippy
      - run: rustup override set 1.94.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:browser-storage
      - run: pnpm test:accessibility
      - run: cp deploy/docker/Cargo.lock.hosted-provider Cargo.lock
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Compile and test every Rust crate against the exact SDK revision used
      # by the production provider image. This keeps path-only developer
      # dependencies from making a clean checkout unreproducible.
      - run: cargo test --locked --workspace
        env:
          MDBASE_CONNECT_ENV: test
          MDBASE_CONNECT_SECRET_BACKEND: insecure-test-file
      - run: cargo build --locked --workspace
      # Exercise the local connector/browser request path in normal CI as well
      # as the durable hosted-provider path below.
      - run: node scripts/e2e.mjs
      - run: node scripts/relay-e2e.mjs
      - run: node scripts/hosted-provider-e2e.mjs
      - run: pnpm e2e:files:adversarial
      # Electron runs natively with an isolated profile while the control
      # plane uses the same packaged Docker boundary as production.
      - run: xvfb-run -a node apps/desktop/scripts/docker-server-e2e.mjs
