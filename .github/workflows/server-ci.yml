name: Server CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

permissions:
  actions: read
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Select qualification depth
    runs-on: ubuntu-24.04
    outputs:
      run_full: ${{ steps.depth.outputs.run_full }}
      upstream_run_id: ${{ steps.depth.outputs.upstream_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'pull_request'
        with:
          node-version: 24
      - id: plan
        name: Select native PR qualification from changed paths
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/server-test-plan.mjs "$BASE" "$HEAD"
      - id: depth
        name: Reuse only an exact merge-queue qualification
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_CHANGES: ${{ steps.plan.outputs.native }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            if [[ $NATIVE_CHANGES == true ]] ||
              jq -e 'any(.pull_request.labels[]?; .name == "ci:full")' \
              "$GITHUB_EVENT_PATH" >/dev/null
            then
              echo 'run_full=true' >>"$GITHUB_OUTPUT"
            else
              echo 'run_full=false' >>"$GITHUB_OUTPUT"
            fi
            echo 'upstream_run_id=' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == merge_group ]]; then
            echo 'run_full=true' >>"$GITHUB_OUTPUT"
            echo 'upstream_run_id=' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          runs=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/server-ci.yml/runs" \
            --field head_sha="$GITHUB_SHA" --field event=merge_group)
          upstream=$(jq -r --arg sha "$GITHUB_SHA" '
            [.workflow_runs[] | select(
              .head_sha == $sha and .event == "merge_group"
              and .conclusion == "success"
            )] | sort_by(.run_number) | last | .id // empty' <<<"$runs")
          if [[ -n $upstream ]]; then
            echo 'run_full=false' >>"$GITHUB_OUTPUT"
            echo "upstream_run_id=$upstream" >>"$GITHUB_OUTPUT"
          else
            echo 'run_full=true' >>"$GITHUB_OUTPUT"
            echo 'upstream_run_id=' >>"$GITHUB_OUTPUT"
          fi

  node:
    needs: classify
    if: needs.classify.outputs.run_full == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      # Real Postgres for the mdbase-next control-plane suites (step below).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mdbase_next_test
          POSTGRES_USER: mdbase
          POSTGRES_PASSWORD: mdbase-next-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mdbase -d mdbase_next_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Prefetch pinned Electron through authenticated release assets
        uses: ./.github/actions/prefetch-electron
        with:
          token: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:vendored-sdk
      - run: pnpm version:check
      - run: pnpm check:release-downloads && pnpm test:release-downloads
      - run: pnpm check:release-readiness
      - run: pnpm check:release-components
      - run: pnpm audit:dependencies
      - run: pnpm check:changelog
      - run: pnpm check:generated
      - run: pnpm check:architecture
      # Workspace packages publish their declarations from dist, so build the
      # dependency graph before checking downstream consumers.
      - run: pnpm build
      # Browser-only provider boundaries run alongside the slower Rust and
      # system suites instead of extending their critical path.
      # `--with-deps` pulls system packages from distribution mirrors. On
      # 2026-08-19 azure.archive.ubuntu.com served 21 MB of font packages at
      # under 50 KB/s, hanging the step for 75 minutes before it was bounded.
      #
      # Cache the browser so most runs never contact a mirror at all, and keep
      # the timeout so a cache miss on a slow day fails fast instead of
      # silently consuming an hour.
      - name: Restore Playwright cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.classify.outputs.run_full == 'true'
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: "Cache marker: playwright hit"
        if: needs.classify.outputs.run_full == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: echo 'Playwright cache hit.'
      - name: "Cache marker: playwright miss"
        if: needs.classify.outputs.run_full == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: echo 'Playwright cache miss.'
      # The system dependencies are font packages that the runner image
      # already carries; only a cache miss needs them refreshed. A miss must be
      # able to finish even on a slow mirror, or the cache never populates and
      # every run pays the same cost -- so this path gets a wider budget than
      # the cached path. It is still bounded: the 2026-08-19 hang ran 75
      # minutes unbounded.
      - name: Install Chromium (cache miss)
        if: needs.classify.outputs.run_full == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 30
      - name: Install Chromium (cache hit)
        if: needs.classify.outputs.run_full == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install chromium
        timeout-minutes: 5
      - if: needs.classify.outputs.run_full == 'true'
        run: pnpm test:accessibility
      - run: pnpm typecheck
      - run: pnpm test
      - name: mdbase-next control plane against Postgres
        env:
          MDBASE_CONNECT_TEST_DATABASE_URL: postgres://mdbase:mdbase-next-test@127.0.0.1:5432/mdbase_next_test
          MDBASE_CONNECT_DESTRUCTIVE_TEST_APPROVAL: I APPROVE MDBASE CONNECT DESTRUCTIVE POSTGRES TESTS
        run: pnpm --filter @mdbase/connect-server exec vitest run src/features/next src/features/account/collection-creation.postgres.test.ts src/features/connectors/installation-pairing.postgres.test.ts src/features/applications/sdk-registration.postgres.test.ts src/features/collections/collection-membership-policy.postgres.test.ts src/features/instance-admin/collection-diagnostics.postgres.test.ts src/features/usage/ops-metrics-push.postgres.test.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: flake-evidence-node-${{ github.run_attempt }}
          path: .ci-flakes/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - if: needs.classify.outputs.run_full == 'true'
        run: pnpm package:audit
      - name: Pack qualified public packages
        if: needs.classify.outputs.run_full == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/npm-packages"
          while IFS=$'\t' read -r package_name package_dir; do
            pnpm --dir "$package_dir" pack \
              --pack-destination "$RUNNER_TEMP/npm-packages"
          done < <(node scripts/public-packages.mjs)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.classify.outputs.run_full == 'true'
        with:
          name: qualified-npm-packages
          path: ${{ runner.temp }}/npm-packages/*.tgz
          if-no-files-found: error
          retention-days: 90

  # Main pushes reuse the merge-queue qualification, so `node` rarely runs on
  # main. Size history needs every main commit: build only the Editor and its
  # workspace dependencies. Informational: not part of Qualification.
  editor-sizes:
    name: Editor size history
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Prefetch pinned Electron through authenticated release assets
        uses: ./.github/actions/prefetch-electron
        with:
          token: ${{ github.token }}
      - run: pnpm install --frozen-lockfile --filter "mdbase-editor..."
      - run: pnpm --filter "mdbase-editor..." build
      - name: Record Editor bundle sizes
        id: performance_editor
        continue-on-error: true
        run: node scripts/performance-report.mjs --app apps/editor --out "$RUNNER_TEMP/editor-sizes.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.performance_editor.outcome == 'success'
        continue-on-error: true
        with:
          name: performance-editor-sizes
          path: ${{ runner.temp }}/editor-sizes.json
          retention-days: 90
          if-no-files-found: error
      - name: Publish Editor size history
        if: steps.performance_editor.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/post-performance
        with:
          report: ${{ runner.temp }}/editor-sizes.json
          token: ${{ secrets.OPS_BENCHMARK_TOKEN }}

  server-container-full:
    needs: classify
    if: needs.classify.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: docker build --file deploy/docker/Dockerfile.server --tag mdbase-connect-server:test .
      - run: docker build --file deploy/docker/Dockerfile.nats --tag mdbase-connect-nats:test .
      - run: >-
          MDBASE_CONNECT_E2E_BUILD=0
          node test/system/run.mjs --suite container --no-prepare

  log-postgres-conformance:
    name: Log conformance (Postgres)
    needs: classify
    if: needs.classify.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: logsvc_test
          POSTGRES_USER: mdbase
          POSTGRES_PASSWORD: logsvc-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mdbase -d logsvc_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.94.0 --profile minimal
      - name: Run all Postgres log conformance cases
        env:
          MDBN_REQUIRE_REAL_BACKENDS: '1'
          MDBN_TEST_PG_URL: postgres://mdbase:logsvc-test@127.0.0.1:5432/logsvc_test
        run: cargo test --locked -p mdbn-log-conformance --test conformance postgres_backend -- --exact --nocapture

  log-do-conformance:
    name: Log conformance (Durable Objects)
    needs: classify
    if: needs.classify.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runtime/deploy/cloudflare-do
    env:
      MDBN_REQUIRE_REAL_BACKENDS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: rustup toolchain install 1.94.0 --profile minimal --target wasm32-unknown-unknown
      - run: cargo install worker-build --version 0.8.7 --locked
      - name: Prefetch worker-build release tools through authenticated assets
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/prefetch-worker-tools.mjs .
      - run: worker-build --release --locked
      - run: cargo build --locked -p mdbn-log-conformance --bin logsvc-bench
        working-directory: runtime
      - run: npm ci --no-audit --no-fund
      - name: Run all 20 DO log conformance cases and local runtime checks
        env:
          LOGSVC_BENCH: ${{ github.workspace }}/runtime/target/debug/logsvc-bench
        run: node tests/runtime.mjs

  system-suites:
    name: System suite (${{ matrix.shard }})
    needs: classify
    if: needs.classify.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: relay
            suites: relay
            timeout: 55
          - shard: linux-packages
            suites: linux-packages
            timeout: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Prefetch pinned Electron through authenticated release assets
        uses: ./.github/actions/prefetch-electron
        with:
          token: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run ${{ matrix.shard }} system suites
        run: node test/system/run.mjs --suite "${{ matrix.suites }}" --no-prepare
        env:
          MDBASE_CONNECT_ENV: test
          MDBASE_CONNECT_SECRET_BACKEND: insecure-test-file

  runtime-native:
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/runtime-native-tests.yml

  qualification:
    name: Qualification
    if: always()
    needs:
      - classify
      - runtime-native
      - node
      - server-container-full
      - log-postgres-conformance
      - log-do-conformance
      - system-suites
    runs-on: ubuntu-24.04
    steps:
      - name: Require the selected qualification lane
        env:
          RUN_FULL: ${{ needs.classify.outputs.run_full }}
          UPSTREAM_RUN_ID: ${{ needs.classify.outputs.upstream_run_id }}
          RUNTIME_NATIVE: ${{ needs.runtime-native.result }}
          NODE: ${{ needs.node.result }}
          CONTAINER: ${{ needs.server-container-full.result }}
          LOG_POSTGRES: ${{ needs.log-postgres-conformance.result }}
          LOG_DO: ${{ needs.log-do-conformance.result }}
          SYSTEM_SUITES: ${{ needs.system-suites.result }}
        run: |
          if [[ "$RUN_FULL" == true ]]; then
            [[ "$GITHUB_EVENT_NAME" != merge_group || "$RUNTIME_NATIVE" == success ]]
            for result in "$NODE" "$CONTAINER" \
              "$SYSTEM_SUITES" "$LOG_POSTGRES" "$LOG_DO"
            do
              [[ $result == success ]]
            done
          elif [[ -z "$UPSTREAM_RUN_ID" ]]; then
            [[ "$NODE" == success ]]
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record immutable qualification inputs
        env:
          RUN_FULL: ${{ needs.classify.outputs.run_full }}
          UPSTREAM_RUN_ID: ${{ needs.classify.outputs.upstream_run_id }}
        run: |
          kind=fast
          [[ "$RUN_FULL" == true || -n "$UPSTREAM_RUN_ID" ]] && kind=full
          tree=$(git rev-parse HEAD^{tree})
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg tree "$tree" \
            --arg kind "$kind" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg upstream_run_id "$UPSTREAM_RUN_ID" \
            --arg pnpm_lock_sha256 "$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" \
            --arg workflow_sha256 "$(sha256sum .github/workflows/server-ci.yml | cut -d' ' -f1)" \
            '{schema_version:1,qualification:$kind,commit:$commit,tree:$tree,
              event:$event,run_id:$run_id,
              upstream_run_id:(if $upstream_run_id == "" then null else $upstream_run_id end),
              inputs:{pnpm_lock_sha256:$pnpm_lock_sha256,
                workflow_sha256:$workflow_sha256}}' \
            >qualification.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-qualification
          path: qualification.json
          if-no-files-found: error
          retention-days: 90
