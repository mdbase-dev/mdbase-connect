name: Editor CI and release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/editor/**"
      - "packages/client/**"
      - "packages/management/**"
      - "packages/protocol/**"
      - "packages/app-ui/**"
      - "packages/i18n/**"
      - "packages/ui/**"
      - "services/feedback/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/editor-pages.yml"
      - "scripts/verify-client-publication.mjs"
      - "scripts/lib/*publication*.test.mjs"
      - "config/release-components.json"
      - "config/next-trust/**"
      - "scripts/continuous-sdk-release.mjs"
      - "scripts/lib/sdk-publication.mjs"
      - "tools/editor-native-publisher/**"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character source commit, reachable from main.
        required: true
        type: string
      target:
        description: Editor target; dispatch this workflow on main.
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  actions: read
  contents: read

concurrency:
  group: editor-pages-${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# PRs and main pushes test only. Ops dispatches immutable main ancestors.
jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter mdbase-editor i18n:check
      - run: git diff --exit-code -- apps/editor/src/i18n/locales
      - run: pnpm --filter mdbase-editor typecheck
      - run: pnpm --filter mdbase-editor test
      - run: pnpm --filter @mdbase/feedback-worker typecheck
      - run: pnpm --filter @mdbase/feedback-worker test
      - run: pnpm --filter mdbase-editor test:deployment
      - run: pnpm --filter mdbase-editor test:publisher
      - run: node --test scripts/lib/*publication*.test.mjs
      - name: Restore Playwright cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: "Cache marker: playwright hit"
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: echo 'Playwright cache hit.'
      - name: "Cache marker: playwright miss"
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: echo 'Playwright cache miss.'
      - name: Install Chromium (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 30
      - name: Install Chromium (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install chromium
        timeout-minutes: 5
      - run: pnpm --filter mdbase-editor test:e2e
      - run: pnpm --filter mdbase-editor build
        env:
          MDBASE_EDITOR_ORIGIN: https://editor.mdbase.dev
          MDBASE_EDITOR_BASE_PATH: /
      - run: pnpm --filter mdbase-editor check:bundle
      - run: pnpm --filter mdbase-editor check:csp

  native-dispatch:
    # Validate dispatch shape before acquiring an environment.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - env:
          TARGET: ${{ inputs.target }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          case "$TARGET" in staging|production) ;; *) exit 1 ;; esac
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          node apps/editor/scripts/native/refs.mjs

  native-inputs:
    needs: native-dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: editor-${{ inputs.target }}
    outputs:
      trust: ${{ steps.hashes.outputs.trust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Workflow-owned ancestry check before reading environment inputs
        env:
          TARGET: ${{ inputs.target }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node apps/editor/scripts/native/refs.mjs
      - id: hashes
        env:
          EDITOR_TRUST_ASSET_SHA256: ${{ vars.EDITOR_TRUST_ASSET_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$EDITOR_TRUST_ASSET_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf 'trust=%s\n' "$EDITOR_TRUST_ASSET_SHA256" >> "$GITHUB_OUTPUT"

  native-build:
    name: Unprivileged frozen native Editor build
    needs: native-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # No GitHub environment or Cloudflare secrets. Original intake before hooks.
    defaults:
      run:
        working-directory: candidate
    env:
      TARGET: ${{ inputs.target }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      # Public build inputs: Pages runtime variables do not configure Vite assets.
      VITE_MDBASE_FEEDBACK_URL: ${{ inputs.target == 'production' && 'https://feedback-api.mdbase.dev/v1/feedback' || 'https://feedback-api-staging.mdbase.dev/v1/feedback' }}
      VITE_MDBASE_TURNSTILE_SITE_KEY: ${{ inputs.target == 'production' && '0x4AAAAAAEboz_mLT-taI3H-' || '0x4AAAAAAEbkvA4d9vQJq2D1' }}
      EDITOR_TRUST_ASSET_SHA256: ${{ needs.native-inputs.outputs.trust }}
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: publisher
          fetch-depth: 0
          persist-credentials: false
      - name: Workflow-owned ancestry check before candidate checkout or execution
        working-directory: publisher
        run: node apps/editor/scripts/native/refs.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Data-only original intake before dependency execution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/editor-build"
          node apps/editor/scripts/native/publisher.mjs guard > "$RUNNER_TEMP/editor-build/plan.json"
      - run: node apps/editor/scripts/native/install-inputs.mjs "$RUNNER_TEMP/editor-build/plan.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: ALL installed original members, then unprivileged build once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node apps/editor/scripts/native/build.mjs "$RUNNER_TEMP/editor-build"
      - run: node apps/editor/scripts/native/envelope.mjs "$RUNNER_TEMP/editor-build"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: editor-native-build-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/editor-build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Retain failed build plan without manufacturing a successful artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-native-build-failure-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/editor-build/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

  native-deploy:
    name: Protected immutable Editor upload
    needs: [native-inputs, native-build]
    runs-on: ubuntu-24.04
    # Upload has a separate 7-minute bound; leave time for checks and recovery.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: publisher
    concurrency:
      group: editor-native-upload-${{ inputs.target }}
      cancel-in-progress: false
    # External environment policy admits main without per-publish approval.
    environment:
      name: editor-${{ inputs.target }}
      url: ${{ inputs.target == 'production' && 'https://editor.mdbase.dev/' || 'https://editor-staging.mdbase.dev/' }}
    env:
      TARGET: ${{ inputs.target }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      EDITOR_TRUST_ASSET_SHA256: ${{ vars.EDITOR_TRUST_ASSET_SHA256 }}
      ARTIFACT_ID: ${{ needs.native-build.outputs.artifact-id }}
      ARTIFACT_DIGEST: ${{ needs.native-build.outputs.artifact-digest }}
      EDITOR_SOURCE_ROOT: ${{ github.workspace }}/candidate
      WRANGLER_SEND_METRICS: 'false'
    steps:
      # A recovery point must predate everything its run published.
      - name: One publication per run; dispatch a new run to retry
        timeout-minutes: 1
        working-directory: ${{ github.workspace }}
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: publisher
          fetch-depth: 0
          persist-credentials: false
        timeout-minutes: 3
      - name: Workflow-owned ancestry check before candidate data is read
        timeout-minutes: 1
        run: node apps/editor/scripts/native/refs.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
        timeout-minutes: 3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
        timeout-minutes: 2
      - name: Workflow-owned guard; candidate is data only
        timeout-minutes: 7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/editor-receipt" "$RUNNER_TEMP/editor-upload"
          node apps/editor/scripts/native/publisher.mjs guard > "$RUNNER_TEMP/editor-receipt/plan.json"
      - name: Isolated official tool lock only; no app hooks
        timeout-minutes: 3
        run: node apps/editor/scripts/native/tool.mjs "$RUNNER_TEMP/editor-tool-path"
      - name: Immutable artifact identity and full original inventory
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node apps/editor/scripts/native/artifact.mjs "$RUNNER_TEMP/editor-upload/artifact"
          cp "$RUNNER_TEMP/editor-upload/artifact/"{inventory.json,envelope.json} "$RUNNER_TEMP/editor-receipt/"
          cp "$RUNNER_TEMP/editor-upload/artifact-metadata.json" "$RUNNER_TEMP/editor-receipt/"
          cmp "$RUNNER_TEMP/editor-receipt/plan.json" "$RUNNER_TEMP/editor-upload/artifact/plan.json"
          node apps/editor/scripts/native/publisher.mjs inventory "$RUNNER_TEMP/editor-upload/artifact/publish" "$RUNNER_TEMP/editor-receipt/plan.json" > "$RUNNER_TEMP/editor-receipt/revalidated-inventory.json"
          cmp "$RUNNER_TEMP/editor-receipt/inventory.json" "$RUNNER_TEMP/editor-receipt/revalidated-inventory.json"
          chmod -R a-w "$RUNNER_TEMP/editor-upload/artifact"
      - name: Existing project identity (never provision)
        timeout-minutes: 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node apps/editor/scripts/native/publisher.mjs project > "$RUNNER_TEMP/editor-receipt/project.json"
      - name: Capture production recovery point before upload
        timeout-minutes: 4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node apps/editor/scripts/native/rollback.mjs snapshot "$RUNNER_TEMP/editor-receipt"
      # Stored before upload, so recovery survives a lost job or receipt.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.target == 'production'
        timeout-minutes: 2
        with:
          name: editor-production-recovery-point-${{ github.run_id }}
          path: ${{ runner.temp }}/editor-receipt/previous.json
          if-no-files-found: error
          retention-days: 90
      - name: Recheck immutable inventory and upload once
        id: upload
        timeout-minutes: 7
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node apps/editor/scripts/native/refs.mjs
          branch=$(jq -er .pagesBranch "$RUNNER_TEMP/editor-receipt/plan.json")
          node apps/editor/scripts/native/publisher.mjs assert-inventory "$RUNNER_TEMP/editor-upload/artifact/publish" "$RUNNER_TEMP/editor-receipt/inventory.json"
          cli=$(cat "$RUNNER_TEMP/editor-tool-path")
          cd "$RUNNER_TEMP/editor-upload"
          node "$cli" pages deploy artifact/publish --no-bundle --project-name mdbase-editor --branch "$branch" --commit-hash "$SOURCE_SHA" --commit-dirty=false > "$RUNNER_TEMP/editor-upload/wrangler-output.txt" 2>&1
      - name: Resolve actual full deployment UUID before served checks
        id: deployment
        timeout-minutes: 1
        if: always() && (steps.upload.outcome == 'success' || steps.upload.outcome == 'failure' || steps.upload.outcome == 'cancelled')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node apps/editor/scripts/native/publisher.mjs capture "$RUNNER_TEMP/editor-upload/wrangler-output.txt" > "$RUNNER_TEMP/editor-receipt/deployment.json"
      - name: All deployment URL AND alias bytes, source-owned headers and routes
        id: verification
        timeout-minutes: 9
        if: always() && steps.deployment.outcome == 'success'
        run: node apps/editor/scripts/native/hosting.mjs "$RUNNER_TEMP/editor-receipt/plan.json" "$RUNNER_TEMP/editor-receipt/inventory.json" "$RUNNER_TEMP/editor-receipt/deployment.json" > "$RUNNER_TEMP/editor-receipt/verification.json"
      - name: Preserve honest failure or complete static-publication receipt
        timeout-minutes: 1
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/editor-upload/artifact-metadata.json" ]; then cp "$RUNNER_TEMP/editor-upload/artifact-metadata.json" "$RUNNER_TEMP/editor-receipt/"; fi
          node apps/editor/scripts/native/publisher.mjs receipt "$RUNNER_TEMP/editor-receipt" > "$RUNNER_TEMP/editor-receipt/receipt.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        if: always()
        with:
          name: editor-native-receipt-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/editor-receipt/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

  smoke:
    name: Editor fresh-browser smoke
    needs: native-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # No environment, Cloudflare credentials, candidate checkout or app install.
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      TARGET: ${{ inputs.target }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.editor-smoke-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Browser packages come from a mirror that can take minutes per file, and a failed production smoke restores.
      - name: Isolated pinned browser tool with install scripts disabled
        timeout-minutes: 15
        run: |
          set -euo pipefail
          node apps/editor/scripts/native/tool.mjs "$RUNNER_TEMP/editor-smoke-tool" smoke
          module=$(cat "$RUNNER_TEMP/editor-smoke-tool")
          node "$(dirname "$module")/cli.js" install --with-deps chromium
      - name: Fresh load, source entry asset, readiness and sign-in
        timeout-minutes: 3
        run: node apps/editor/scripts/native/smoke.mjs "$RUNNER_TEMP/editor-smoke-tool" "$RUNNER_TEMP/editor-smoke.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: editor-${{ inputs.target }}-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/editor-smoke.json
          if-no-files-found: warn
          retention-days: 90

  production-recovery:
    name: Restore production after incomplete publication or smoke
    needs: [native-deploy, smoke]
    # A job-level always() still runs after cancellation or a job timeout.
    if: always() && inputs.target == 'production' && needs.native-deploy.result != 'skipped' && needs.smoke.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: editor-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
        timeout-minutes: 3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
        timeout-minutes: 2
      - name: Find the recovery point stored before upload
        id: point
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ needs.native-deploy.result }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=editor-production-recovery-point-$GITHUB_RUN_ID" --jq '[.artifacts[]|select(.expired|not)]|first|.id // empty')
          if [ -z "$id" ] && [ "$DEPLOY_RESULT" = success ]; then
            echo 'A completed publication has no recovery point' >&2
            exit 1
          fi
          echo "artifact-id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.point.outputs.artifact-id != ''
        timeout-minutes: 2
        with:
          artifact-ids: ${{ steps.point.outputs.artifact-id }}
          path: ${{ runner.temp }}/editor-recovery
          merge-multiple: true
      - name: Restore snapshot and verify every previous asset; keep run failed
        if: steps.point.outputs.artifact-id != ''
        timeout-minutes: 7
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node apps/editor/scripts/native/rollback.mjs recover "$RUNNER_TEMP/editor-recovery"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 2
        if: always() && steps.point.outputs.artifact-id != ''
        with:
          name: editor-production-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/editor-recovery/
          if-no-files-found: warn
          retention-days: 90
