name: Editor CI and release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/editor/**"
      - "packages/client/**"
      - "packages/management/**"
      - "packages/protocol/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/editor-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter mdbase-editor typecheck
      - run: pnpm --filter mdbase-editor test
      - run: pnpm --filter mdbase-editor test:deployment
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter mdbase-editor test:e2e
      - run: pnpm --filter mdbase-editor build
        env:
          MDBASE_EDITOR_ORIGIN: https://editor.mdbase.dev
          MDBASE_EDITOR_BASE_PATH: /
      - run: pnpm --filter mdbase-editor check:bundle
      - run: pnpm --filter mdbase-editor check:csp

  deploy-cloudflare:
    if: github.event_name != 'pull_request' && vars.CLOUDFLARE_PAGES_ENABLED == '1'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://editor.mdbase.dev/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Build editor
        run: pnpm --filter mdbase-editor build
        env:
          MDBASE_EDITOR_ORIGIN: https://editor.mdbase.dev
          MDBASE_EDITOR_BASE_PATH: /
      - name: Verify editor manifest
        run: node apps/editor/scripts/verify-deployment-manifest.mjs apps/editor/dist/.well-known/mdbase-app.json https://editor.mdbase.dev/
      - name: Deploy editor
        run: npx --yes --package wrangler@4.114.0 wrangler pages deploy apps/editor/dist --project-name=mdbase-editor --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production custom domain
        run: node apps/editor/scripts/verify-deployment-manifest.mjs https://editor.mdbase.dev/.well-known/mdbase-app.json https://editor.mdbase.dev/
        env:
          MDBASE_MANIFEST_VERIFY_ATTEMPTS: 12
          MDBASE_MANIFEST_VERIFY_DELAY_MS: 5000
      - name: Verify production assets
        run: node apps/editor/scripts/verify-deployment-assets.mjs apps/editor/dist/assets https://editor.mdbase.dev/
        env:
          MDBASE_ASSET_VERIFY_ATTEMPTS: 61
          MDBASE_ASSET_VERIFY_DELAY_MS: 5000

  deploy-cloudflare-staging:
    if: github.event_name != 'pull_request' && vars.CLOUDFLARE_PAGES_ENABLED == '1'
    needs: [test, deploy-cloudflare]
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages-staging
      url: https://editor-staging.mdbase.dev/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Build staging editor
        run: pnpm --filter mdbase-editor build
        env:
          MDBASE_EDITOR_ORIGIN: https://editor-staging.mdbase.dev
          MDBASE_EDITOR_BASE_PATH: /
          VITE_MDBASE_CONNECT_URL: https://connect-staging.mdbase.dev
      - name: Deploy staging editor
        run: npx --yes --package wrangler@4.114.0 wrangler pages deploy apps/editor/dist --project-name=mdbase-editor --branch=staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Attach staging domain
        run: node apps/editor/scripts/ensure-pages-domain.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: mdbase-editor
          CLOUDFLARE_PAGES_DOMAIN: editor-staging.mdbase.dev
      - name: Verify staging custom domain
        run: node apps/editor/scripts/verify-deployment-manifest.mjs https://editor-staging.mdbase.dev/.well-known/mdbase-app.json https://editor-staging.mdbase.dev/
        env:
          MDBASE_MANIFEST_VERIFY_ATTEMPTS: 12
          MDBASE_MANIFEST_VERIFY_DELAY_MS: 5000
      - name: Verify staging assets
        run: node apps/editor/scripts/verify-deployment-assets.mjs apps/editor/dist/assets https://editor-staging.mdbase.dev/
        env:
          MDBASE_ASSET_VERIFY_ATTEMPTS: 61
          MDBASE_ASSET_VERIFY_DELAY_MS: 5000
