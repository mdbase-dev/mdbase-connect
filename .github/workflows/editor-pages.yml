name: Editor CI and release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/editor/**"
      - "packages/client/**"
      - "packages/management/**"
      - "packages/protocol/**"
      - "packages/ui/**"
      - "services/feedback/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/editor-pages.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Deploy staging by default; production requires an explicit dispatch
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: editor-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter mdbase-editor typecheck
      - run: pnpm --filter mdbase-editor test
      - run: pnpm --filter @mdbase/feedback-worker typecheck
      - run: pnpm --filter @mdbase/feedback-worker test
      - run: pnpm --filter mdbase-editor test:deployment
      - name: Restore Playwright cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: "Cache marker: playwright hit"
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: echo 'Playwright cache hit.'
      - name: "Cache marker: playwright miss"
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: echo 'Playwright cache miss.'
      - name: Install Chromium (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 30
      - name: Install Chromium (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install chromium
        timeout-minutes: 5
      - run: pnpm --filter mdbase-editor test:e2e
      - run: pnpm --filter mdbase-editor build
        env:
          MDBASE_EDITOR_ORIGIN: https://editor.mdbase.dev
          MDBASE_EDITOR_BASE_PATH: /
      - run: pnpm --filter mdbase-editor check:bundle
      - run: pnpm --filter mdbase-editor check:csp

  deploy-cloudflare:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.target == 'production' &&
      vars.CLOUDFLARE_PAGES_ENABLED == '1'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://editor.mdbase.dev/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Build editor
        run: pnpm --filter mdbase-editor build
        env:
          MDBASE_EDITOR_ORIGIN: https://editor.mdbase.dev
          MDBASE_EDITOR_BASE_PATH: /
          VITE_MDBASE_BUILD_REVISION: ${{ github.sha }}
          VITE_MDBASE_ENV: production
          VITE_MDBASE_FEEDBACK_URL: ${{ vars.MDBASE_FEEDBACK_URL }}
          VITE_MDBASE_TURNSTILE_SITE_KEY: ${{ vars.MDBASE_FEEDBACK_TURNSTILE_SITE_KEY }}
      - name: Verify editor manifest
        run: node apps/editor/scripts/verify-deployment-manifest.mjs apps/editor/dist/.well-known/mdbase-app.json https://editor.mdbase.dev/
      - name: Deploy editor
        run: npx --yes --package wrangler@4.114.0 wrangler pages deploy apps/editor/dist --project-name=mdbase-editor --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production custom domain
        run: node apps/editor/scripts/verify-deployment-manifest.mjs https://editor.mdbase.dev/.well-known/mdbase-app.json https://editor.mdbase.dev/
        env:
          MDBASE_MANIFEST_VERIFY_ATTEMPTS: 12
          MDBASE_MANIFEST_VERIFY_DELAY_MS: 5000
      - name: Verify production assets
        run: node apps/editor/scripts/verify-deployment-assets.mjs apps/editor/dist/assets https://editor.mdbase.dev/
        env:
          MDBASE_ASSET_VERIFY_ATTEMPTS: 61
          MDBASE_ASSET_VERIFY_DELAY_MS: 5000

  deploy-cloudflare-staging:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.CLOUDFLARE_PAGES_ENABLED == '1' &&
      (github.event_name == 'push' || inputs.target == 'staging')
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages-staging
      url: https://editor-staging.mdbase.dev/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Build staging editor
        run: pnpm --filter mdbase-editor build
        env:
          MDBASE_EDITOR_ORIGIN: https://editor-staging.mdbase.dev
          MDBASE_EDITOR_BASE_PATH: /
          MDBASE_CONNECT_URL: https://connect-staging.mdbase.dev
          VITE_MDBASE_CONNECT_URL: https://connect-staging.mdbase.dev
          VITE_MDBASE_BUILD_REVISION: ${{ github.sha }}
          VITE_MDBASE_ENV: staging
          VITE_MDBASE_FEEDBACK_URL: ${{ vars.MDBASE_FEEDBACK_URL }}
          VITE_MDBASE_TURNSTILE_SITE_KEY: ${{ vars.MDBASE_FEEDBACK_TURNSTILE_SITE_KEY }}
      - name: Verify staging editor manifest
        run: node apps/editor/scripts/verify-deployment-manifest.mjs apps/editor/dist/.well-known/mdbase-app.json https://editor-staging.mdbase.dev/ https://connect-staging.mdbase.dev
      - name: Deploy staging editor
        run: npx --yes --package wrangler@4.114.0 wrangler pages deploy apps/editor/dist --project-name=mdbase-editor --branch=staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Attach staging domain
        run: node apps/editor/scripts/ensure-pages-domain.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: mdbase-editor
          CLOUDFLARE_PAGES_DOMAIN: editor-staging.mdbase.dev
      - name: Verify staging custom domain
        run: node apps/editor/scripts/verify-deployment-manifest.mjs https://editor-staging.mdbase.dev/.well-known/mdbase-app.json https://editor-staging.mdbase.dev/ https://connect-staging.mdbase.dev
        env:
          MDBASE_MANIFEST_VERIFY_ATTEMPTS: 12
          MDBASE_MANIFEST_VERIFY_DELAY_MS: 5000
      - name: Verify staging assets
        run: node apps/editor/scripts/verify-deployment-assets.mjs apps/editor/dist/assets https://editor-staging.mdbase.dev/
        env:
          MDBASE_ASSET_VERIFY_ATTEMPTS: 61
          MDBASE_ASSET_VERIFY_DELAY_MS: 5000
