name: Editor CI

on:
  push:
    branches: [main]
    paths:
      - "apps/editor/**"
      - "packages/client/**"
      - "packages/management/**"
      - "packages/protocol/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/editor-pages.yml"
  pull_request:
    paths:
      - "apps/editor/**"
      - "packages/client/**"
      - "packages/management/**"
      - "packages/protocol/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/editor-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter mdbase-editor typecheck
      - run: pnpm --filter mdbase-editor test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter mdbase-editor test:e2e
      - run: pnpm --filter mdbase-editor build
        env:
          MDBASE_EDITOR_ORIGIN: https://editor.mdbase.dev
          MDBASE_EDITOR_BASE_PATH: /
      - run: pnpm --filter mdbase-editor check:bundle
      - run: pnpm --filter mdbase-editor check:csp
