name: Flake stress

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      iterations:
        description: Repetitions per suite (1-1000, no retries)
        default: '20'
        type: string

permissions:
  contents: read

# Serialize issue updates as well as the expensive stress matrix.
concurrency:
  group: flake-stress
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '2'
  RUST_TEST_THREADS: '2'
  MDBASE_CONNECT_ENV: test
  MDBASE_CONNECT_SECRET_BACKEND: insecure-test-file
  STRESS_ITERATIONS: ${{ inputs.iterations || '20' }}

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: mdbase-connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mdbase-connect
          persist-credentials: false
      - id: engine
        run: echo "revision=$(tr -d '\r\n' < deploy/docker/mdbase-rs-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: callumalpass/mdbase-rs
          ref: ${{ steps.engine.outputs.revision }}
          path: mdbase-rs
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: rustup override set 1.94.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: mdbase-connect -> target
          shared-key: connect-debug-${{ steps.engine.outputs.revision }}
          save-if: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - if: runner.os == 'macOS'
        run: brew install cpulimit
      - name: Repeat timing-sensitive suites with a two-CPU budget
        run: node scripts/ci/two-cpus.mjs scripts/ci/stress.mjs "$STRESS_ITERATIONS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stress-evidence-${{ matrix.os }}-${{ github.run_attempt }}
          path: mdbase-connect/.ci-flakes/
          include-hidden-files: true
          retention-days: 14

  report:
    needs: stress
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stress-evidence-*
          path: stress-evidence
      - name: Open or update the single tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/track-flakes.mjs stress-evidence
