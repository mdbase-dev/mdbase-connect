name: Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS signed and notarized
            os: macos-15
            artifact: desktop-macos
            platform: macos
          - label: Windows signed
            os: windows-2025
            artifact: desktop-windows
            platform: windows
          - label: Linux signed
            os: ubuntu-24.04
            artifact: desktop-linux
            platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mdbase-connect

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mdbase-connect

      - id: version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          desktop_version="$(node -p "require('./apps/desktop/package.json').version")"
          test "$package_version" = "$desktop_version"
          test "v$package_version" = "$GITHUB_REF_NAME"
          echo "value=$package_version" >> "$GITHUB_OUTPUT"

      - id: mdbase_revision
        shell: bash
        run: echo "revision=$(tr -d '\r\n' < deploy/docker/mdbase-rs-revision)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: callumalpass/mdbase-rs
          ref: ${{ steps.mdbase_revision.outputs.revision }}
          path: mdbase-rs

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mdbase-connect/pnpm-lock.yaml

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup override set 1.94.0

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot rpm

      - name: Import Apple signing identity
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "$MACOS_CERTIFICATE_P12_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$APPLE_API_KEY_P8_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"

          certificate_path="$RUNNER_TEMP/mdbase-connect-signing.p12"
          keychain_path="$RUNNER_TEMP/mdbase-connect.keychain-db"
          keychain_password="mdbase-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"

      - name: Configure SSL.com eSigner
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_ESIGNER_USERNAME: ${{ secrets.WINDOWS_ESIGNER_USERNAME }}
          WINDOWS_ESIGNER_PASSWORD: ${{ secrets.WINDOWS_ESIGNER_PASSWORD }}
          WINDOWS_ESIGNER_TOTP_SECRET: ${{ secrets.WINDOWS_ESIGNER_TOTP_SECRET }}
        run: |
          foreach ($name in @(
            "WINDOWS_ESIGNER_USERNAME",
            "WINDOWS_ESIGNER_PASSWORD",
            "WINDOWS_ESIGNER_TOTP_SECRET"
          )) {
            if (-not (Get-Item "env:$name").Value) {
              throw "$name is not configured"
            }
          }

          $archive = Join-Path $env:RUNNER_TEMP "SSL.COM-eSigner-CKA_1.0.6.zip"
          $unpacked = Join-Path $env:RUNNER_TEMP "esigner-cka-unpacked"
          $installDir = Join-Path $env:RUNNER_TEMP "esigner-cka"
          $masterKey = Join-Path $installDir "master.key"
          $downloadUrl = "https://github.com/SSLcom/eSignerCKA/releases/download/v1.0.6/SSL.COM-eSigner-CKA_1.0.6.zip"
          $expectedSha256 = "e4971440e4ebed94328492cf36e18999554c5c657c856f1cb14a6072c8b1c263"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $archive
          $actualSha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Unexpected eSigner CKA archive checksum: $actualSha256"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
          $installer = Get-ChildItem $unpacked -Recurse -File -Filter "*.exe" |
            Where-Object { $_.Name -match "eSigner.*CKA" } |
            Select-Object -First 1
          if (-not $installer) {
            throw "eSigner CKA installer is missing from the verified archive"
          }

          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $install = Start-Process `
            -FilePath $installer.FullName `
            -ArgumentList @(
              "/CURRENTUSER",
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/DIR=$installDir"
            ) `
            -Wait `
            -PassThru
          if ($install.ExitCode -ne 0) {
            throw "eSigner CKA installation failed with exit code $($install.ExitCode)"
          }

          $cka = Join-Path $installDir "eSignerCKATool.exe"
          if (-not (Test-Path $cka)) {
            throw "eSignerCKATool.exe is missing after installation"
          }

          & $cka config `
            -mode product `
            -user $env:WINDOWS_ESIGNER_USERNAME `
            -pass $env:WINDOWS_ESIGNER_PASSWORD `
            -totp $env:WINDOWS_ESIGNER_TOTP_SECRET `
            -key $masterKey `
            -r
          if ($LASTEXITCODE -ne 0) {
            throw "eSigner CKA configuration failed"
          }

          & $cka unload
          & $cka load
          if ($LASTEXITCODE -ne 0) {
            throw "eSigner CKA certificate loading failed"
          }

          $certificates = @(
            Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert |
              Where-Object { $_.NotAfter -gt (Get-Date) }
          )
          if ($certificates.Count -ne 1) {
            throw "Expected exactly one current eSigner code-signing certificate, found $($certificates.Count)"
          }

          $thumbprint = $certificates[0].Thumbprint
          $signParams = "/sha1 $thumbprint"
          "WINDOWS_SIGN_WITH_PARAMS=$signParams" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @mdbase/connect-desktop make

      - name: Verify macOS signature and notarization
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          app_path="$(find apps/desktop/out -type d -name 'mdbase connect.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          dmg_path="$(find apps/desktop/out/make -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"

      - name: Verify Windows signatures
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $application = Get-ChildItem apps/desktop/out -Recurse -File -Filter mdbase-connect.exe |
            Where-Object { $_.FullName -notmatch '\\make\\' } |
            Select-Object -First 1
          $installer = Get-ChildItem apps/desktop/out/make -Recurse -File -Filter *.exe |
            Where-Object { $_.Name -match 'Setup' } |
            Select-Object -First 1
          if (-not $application) { throw "Packaged application executable is missing" }
          if (-not $installer) { throw "Squirrel installer is missing" }
          foreach ($file in @($application, $installer)) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($file.FullName): $($signature.Status)"
            }
          }

      - name: Install cosign
        if: matrix.platform == 'linux'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Linux packages
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mapfile -t packages < <(find apps/desktop/out/make -type f \( -name '*.deb' -o -name '*.rpm' \) -print)
          test "${#packages[@]}" -gt 0
          for package in "${packages[@]}"; do
            cosign sign-blob --yes --bundle "$package.sigstore.json" "$package"
            cosign verify-blob \
              --bundle "$package.sigstore.json" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/desktop-release.yml@refs/tags/" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$package"
          done

      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          find apps/desktop/out/make -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.nupkg' \
               -o -name '*.deb' -o -name '*.rpm' -o -name '*.sigstore.json' \) \
            -exec cp '{}' release-artifacts/ ';'
          test -n "$(find release-artifacts -type f -print -quit)"
          cd release-artifacts
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 * > "SHA256SUMS-${{ matrix.platform }}"
          else
            sha256sum * > "SHA256SUMS-${{ matrix.platform }}"
          fi

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: mdbase-connect/release-artifacts/*

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: mdbase-connect/release-artifacts/
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --prerelease \
            --title "mdbase connect $GITHUB_REF_NAME"
