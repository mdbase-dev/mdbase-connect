name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      production_verified_commit:
        description: Full tagged SHA independently verified by the release owner after guarded production deployment, including exact service digests and hosted fresh-v2 readiness
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/desktop-release.yml"
      - "scripts/ci/desktop-test-plan.mjs"
      - "scripts/lib/ci-work-selection.test.mjs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".cargo/**"
      - "rust-toolchain*"
      - "deploy/docker/mdbase-rs-revision"
      - "runtime/**"
      - "package.json"
      - "apps/editor/**"
      - "apps/desktop/**"
      - "packages/**"
      - "scripts/lib/package-headless-cli.test.mjs"
      - "scripts/package-headless-cli.mjs"
      - "scripts/ci/smoke-headless-cli.sh"
      - "scripts/configure-windows-store-package.ps1"
      - "scripts/verify-windows-packages.ps1"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  actions: read
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  # Explicit publication must finish once started. Pull-request regressions are
  # replaceable and should not make every superseded commit wait its turn.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      headless: ${{ steps.plan.outputs.headless }}
      windows: ${{ steps.plan.outputs.windows }}
      bundle: ${{ steps.plan.outputs.bundle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/desktop-test-plan.mjs "$BASE" "$HEAD"

  build:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    name: ${{ matrix.label }}
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon desktop
            os: macos-15
            artifact: desktop-macos-arm64
            platform: macos
            arch: arm64
          - label: macOS Intel desktop
            os: macos-15-intel
            artifact: desktop-macos-x64
            platform: macos
            arch: x64
          - label: Windows desktop
            os: windows-2025
            artifact: desktop-windows
            platform: windows
            arch: x64
          - label: Linux signed
            os: ubuntu-24.04
            artifact: desktop-linux
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mdbase-connect
    env:
      WINDOWS_STORE_IDENTITY_NAME: ${{ vars.WINDOWS_STORE_IDENTITY_NAME }}
      WINDOWS_STORE_PUBLISHER: ${{ vars.WINDOWS_STORE_PUBLISHER }}
      WINDOWS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.WINDOWS_STORE_PUBLISHER_DISPLAY_NAME }}
      WINDOWS_STORE_PRODUCT_ID: ${{ vars.WINDOWS_STORE_PRODUCT_ID }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mdbase-connect

      - name: Require exact full Server CI qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/verify-qualified-commit "$GITHUB_SHA"

      - id: version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          desktop_version="$(node -p "require('./apps/desktop/package.json').version")"
          test "$package_version" = "$desktop_version"
          test "v$package_version" = "$GITHUB_REF_NAME"
          echo "value=$package_version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mdbase-connect/pnpm-lock.yaml

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot rpm

      - name: Configure Apple release mode
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12_BASE64" ] \
            && [ -z "$APPLE_API_KEY_P8_BASE64" ] \
            && [ -z "$APPLE_API_KEY_ID" ] \
            && [ -z "$APPLE_API_ISSUER" ]; then
            echo "MACOS_RELEASE_MODE=unsigned" >> "$GITHUB_ENV"
            echo "Apple signing material is absent; publishing an explicitly unsigned beta preview."
            exit 0
          fi

          if [ -z "$MACOS_CERTIFICATE_P12_BASE64" ] \
            || [ -z "$MACOS_CERTIFICATE_PASSWORD" ] \
            || [ -z "$APPLE_API_KEY_P8_BASE64" ] \
            || [ -z "$APPLE_API_KEY_ID" ] \
            || [ -z "$APPLE_API_ISSUER" ]; then
            echo "Apple signing is partially configured; provide every certificate and API-key value or remove the signing material." >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/mdbase-connect-signing.p12"
          keychain_path="$RUNNER_TEMP/mdbase-connect.keychain-db"
          keychain_password="mdbase-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          echo "MACOS_RELEASE_MODE=signed" >> "$GITHUB_ENV"

      - name: Configure Windows release mode
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $identityValues = @(
            $env:WINDOWS_STORE_IDENTITY_NAME,
            $env:WINDOWS_STORE_PUBLISHER,
            $env:WINDOWS_STORE_PUBLISHER_DISPLAY_NAME,
            $env:WINDOWS_STORE_PRODUCT_ID
          )
          $configured = @($identityValues | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($configured -eq 0) {
            "WINDOWS_STORE_MODE=preview" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Output "Partner Center identity is absent; publishing explicitly unsigned beta previews."
            exit 0
          }
          if ($configured -ne $identityValues.Count) {
            throw "Microsoft Store identity is partially configured; provide all four Partner Center values or remove them."
          }

          $build = [int]$env:GITHUB_RUN_NUMBER
          if ($build -gt 65535) {
            throw "GitHub run number exceeds the Microsoft Store version field limit"
          }
          ./scripts/configure-windows-store-package.ps1 `
            -IdentityName $env:WINDOWS_STORE_IDENTITY_NAME `
            -Publisher $env:WINDOWS_STORE_PUBLISHER `
            -PublisherDisplayName $env:WINDOWS_STORE_PUBLISHER_DISPLAY_NAME `
            -PackageVersion "1.0.$build.0"
          "WINDOWS_STORE_MODE=store" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - run: pnpm install --frozen-lockfile
      - name: Enforce release-readiness gates
        shell: bash
        run: |
          if [[ "${{ steps.version.outputs.value }}" == *-* ]]; then
            pnpm check:release-readiness
          else
            pnpm check:release-readiness -- --stable
          fi
      - run: pnpm build
      # The bundled daemon and headless CLI: one package from runtime/, stamped
      # with the app version so `mdbase --version` and readiness report it.
      - name: Build the mdbase daemon from runtime/
        shell: bash
        working-directory: mdbase-connect/runtime
        env:
          MDBN_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          rustup toolchain install
          scripts/check-release-features.sh mdbn-daemon
          cargo build --release --locked -p mdbn-daemon --bin mdbase
          binary="$PWD/target/release/mdbase"
          if [ "$RUNNER_OS" = "Windows" ]; then binary="$(cygpath -w "$binary.exe")"; fi
          "$binary" --version | grep -qF "$MDBN_RELEASE_VERSION"
          echo "MDBN_DAEMON_BIN=$binary" >> "$GITHUB_ENV"
          echo "MDBN_DAEMON_VERSION=$MDBN_RELEASE_VERSION" >> "$GITHUB_ENV"

      - run: pnpm --filter @mdbase/connect-desktop make

      - name: Verify Linux package CLI lifecycle
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          deb="$(find apps/desktop/out/make -type f -name '*.deb' -print -quit)"
          rpm="$(find apps/desktop/out/make -type f -name '*.rpm' -print -quit)"
          node apps/desktop/test/linux-packages/verify.mjs "$deb" "$rpm"

      - name: Verify macOS release mode
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          app_path="$(find apps/desktop/out -type d -name 'mdbase connect.app' -print -quit)"
          test -n "$app_path"
          dmg_path="$(find apps/desktop/out/make -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          if [ "$MACOS_RELEASE_MODE" = "signed" ]; then
            codesign --verify --deep --strict --verbose=2 "$app_path"
            spctl --assess --type execute --verbose=4 "$app_path"
            xcrun stapler validate "$app_path"
          else
            if codesign -dv "$app_path" 2>&1 | grep -q "Authority=Developer ID Application"; then
              echo "Unsigned preview unexpectedly has a Developer ID signature." >&2
              exit 1
            fi
            echo "Verified that the macOS beta preview has no Developer ID signature."
          fi

      - name: Verify Windows packages
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if ($env:WINDOWS_STORE_MODE -eq "store") {
            ./scripts/verify-windows-packages.ps1 `
              -OutPath "apps/desktop/out" `
              -IdentityName $env:WINDOWS_STORE_IDENTITY_NAME `
              -Publisher $env:WINDOWS_STORE_PUBLISHER `
              -PublisherDisplayName $env:WINDOWS_STORE_PUBLISHER_DISPLAY_NAME `
              -PackageVersion $env:WINDOWS_STORE_PACKAGE_VERSION
          } else {
            ./scripts/verify-windows-packages.ps1 `
              -OutPath "apps/desktop/out" `
              -PreviewOnly
          }

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Stage Microsoft Store submission
        if: matrix.platform == 'windows' && env.WINDOWS_STORE_MODE == 'store'
        shell: bash
        run: |
          mkdir -p store-artifacts
          find apps/desktop/out/make -type f -name '*.appx' \
            -exec cp '{}' store-artifacts/ ';'
          test -n "$(find store-artifacts -type f -name '*.appx' -print -quit)"

      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          if [ "${{ matrix.platform }}" = "windows" ]; then
            installer="$(find apps/desktop/out/make -type f -name '*Setup*.exe' -print -quit)"
            portable="$(find apps/desktop/out/make -type f -name '*.zip' -print -quit)"
            test -n "$installer"
            test -n "$portable"
            cp "$installer" \
              "release-artifacts/mdbase-connect-${{ steps.version.outputs.value }}-windows-${{ matrix.arch }}-UNSIGNED-Setup.exe"
            cp "$portable" \
              "release-artifacts/mdbase-connect-${{ steps.version.outputs.value }}-windows-${{ matrix.arch }}-UNSIGNED-portable.zip"
            cp docs/windows-unsigned-preview.txt release-artifacts/
          elif [ "${{ matrix.platform }}" = "macos" ] && [ "$MACOS_RELEASE_MODE" = "unsigned" ]; then
            dmg="$(find apps/desktop/out/make -type f -name '*.dmg' -print -quit)"
            portable="$(find apps/desktop/out/make -type f -name '*.zip' -print -quit)"
            test -n "$dmg"
            test -n "$portable"
            cp "$dmg" \
              "release-artifacts/mdbase-connect-${{ steps.version.outputs.value }}-macos-${{ matrix.arch }}-UNSIGNED.dmg"
            cp "$portable" \
              "release-artifacts/mdbase-connect-${{ steps.version.outputs.value }}-macos-${{ matrix.arch }}-UNSIGNED.zip"
            cp docs/macos-unsigned-preview.txt \
              "release-artifacts/macos-${{ matrix.arch }}-unsigned-preview.txt"
          else
            if [ "${{ matrix.platform }}" = "macos" ]; then
              dmg="$(find apps/desktop/out/make -type f -name '*.dmg' -print -quit)"
              portable="$(find apps/desktop/out/make -type f -name '*.zip' -print -quit)"
              test -n "$dmg"
              test -n "$portable"
              cp "$dmg" \
                "release-artifacts/mdbase-connect-${{ steps.version.outputs.value }}-macos-${{ matrix.arch }}.dmg"
              cp "$portable" \
                "release-artifacts/mdbase-connect-${{ steps.version.outputs.value }}-macos-${{ matrix.arch }}.zip"
            else
              deb="$(find apps/desktop/out/make -type f -name '*.deb' -print -quit)"
              rpm="$(find apps/desktop/out/make -type f -name '*.rpm' -print -quit)"
              test -n "$deb"
              test -n "$rpm"
              cp "$deb" \
                "release-artifacts/mdbase-connect-${{ steps.version.outputs.value }}-linux-${{ matrix.arch }}.deb"
              cp "$rpm" \
                "release-artifacts/mdbase-connect-${{ steps.version.outputs.value }}-linux-${{ matrix.arch }}.rpm"
            fi
          fi
          test -n "$(find release-artifacts -type f -print -quit)"

      - name: Stage canonical headless CLI and daemon
        shell: bash
        run: |
          binary="$MDBN_DAEMON_BIN"
          filename_mode=standard
          if [ "${{ matrix.platform }}" = "windows" ]; then
            filename_mode=unsigned-preview
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            # Publish the copy the app's signing covered, not the unsigned build output.
            app_path="$(find apps/desktop/out -type d -name 'mdbase connect.app' -print -quit)"
            test -n "$app_path"
            binary="$app_path/Contents/Resources/mdbase-next/mdbase"
            if [ "$MACOS_RELEASE_MODE" = "signed" ]; then
              codesign --verify --strict --verbose=2 "$binary"
              team() { codesign -dv "$1" 2>&1 | sed -n 's/^TeamIdentifier=//p'; }
              app_team="$(team "$app_path")"
              test -n "$app_team"
              test "$(team "$binary")" = "$app_team" \
                || { echo "The bundled daemon is not signed by the app's Team ID." >&2; exit 1; }
            else
              filename_mode=unsigned-preview
            fi
          fi
          node scripts/package-headless-cli.mjs \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "${{ steps.version.outputs.value }}" \
            --binary "$binary" \
            --output-directory release-artifacts \
            --filename-mode "$filename_mode"

      - name: Sign and verify release artifact provenance
        shell: bash
        run: |
          found=false
          for artifact in release-artifacts/*; do
            test -f "$artifact" || continue
            found=true
            cosign sign-blob --yes --bundle "$artifact.sigstore.json" "$artifact"
            cosign verify-blob \
              --bundle "$artifact.sigstore.json" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/desktop-release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$artifact"
          done
          "$found"

      - name: Create release checksums
        shell: bash
        run: |
          cd release-artifacts
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 * > "SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}"
          else
            sha256sum * > "SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}"
          fi

      - name: Describe platform update
        shell: bash
        run: |
          arguments=(
            --directory release-artifacts
            --platform "${{ matrix.platform }}"
            --arch "${{ matrix.arch }}"
          )
          if [ "${{ matrix.platform }}" = "macos" ]; then
            if [ "$MACOS_RELEASE_MODE" = "signed" ]; then
              arguments+=(
                --mode automatic
                --action-url '$RELEASE_URL'
                --artifact "mdbase-connect-${{ steps.version.outputs.value }}-macos-${{ matrix.arch }}.zip"
              )
            else
              arguments+=(
                --mode manual
                --action-url '$RELEASE_URL'
                --artifact "mdbase-connect-${{ steps.version.outputs.value }}-macos-${{ matrix.arch }}-UNSIGNED.dmg"
                --artifact "mdbase-connect-${{ steps.version.outputs.value }}-macos-${{ matrix.arch }}-UNSIGNED.zip"
              )
            fi
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            if [ "$WINDOWS_STORE_MODE" = "store" ]; then
              arguments+=(
                --mode store
                --action-url "https://apps.microsoft.com/detail/$WINDOWS_STORE_PRODUCT_ID"
              )
            else
              arguments+=(
                --mode manual
                --action-url '$RELEASE_URL'
                --artifact "mdbase-connect-${{ steps.version.outputs.value }}-windows-${{ matrix.arch }}-UNSIGNED-Setup.exe"
                --artifact "mdbase-connect-${{ steps.version.outputs.value }}-windows-${{ matrix.arch }}-UNSIGNED-portable.zip"
              )
            fi
          else
            arguments+=(
              --mode manual
              --action-url '$RELEASE_URL'
              --artifact "mdbase-connect-${{ steps.version.outputs.value }}-linux-${{ matrix.arch }}.deb"
              --artifact "mdbase-connect-${{ steps.version.outputs.value }}-linux-${{ matrix.arch }}.rpm"
            )
          fi
          node scripts/write-update-input.mjs "${arguments[@]}"

      - name: Sign and verify Microsoft Store submission provenance
        if: matrix.platform == 'windows' && env.WINDOWS_STORE_MODE == 'store'
        shell: bash
        run: |
          for artifact in store-artifacts/*.appx; do
            test -f "$artifact"
            cosign sign-blob --yes --bundle "$artifact.sigstore.json" "$artifact"
            cosign verify-blob \
              --bundle "$artifact.sigstore.json" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/desktop-release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$artifact"
          done
          cd store-artifacts
          sha256sum * > SHA256SUMS-windows-store

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: mdbase-connect/release-artifacts/
          if-no-files-found: error

      - name: Upload Microsoft Store submission
        if: matrix.platform == 'windows' && env.WINDOWS_STORE_MODE == 'store'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-store-submission
          path: mdbase-connect/store-artifacts/
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    environment: desktop-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: release-artifacts
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Create and verify permanent update bootstrap
        shell: bash
        env:
          UPDATE_ROLLOUT_PERCENTAGE: ${{ vars.UPDATE_ROLLOUT_PERCENTAGE }}
          UPDATE_BLOCKED_VERSIONS: ${{ vars.UPDATE_BLOCKED_VERSIONS }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          rollout="${UPDATE_ROLLOUT_PERCENTAGE:-100}"
          # Versions below the committed minimum must update (they bypass rollout).
          minimum="$(node -p "require('./config/desktop-update-minimum.json').minimum_version")"
          published="$(git ls-remote --tags --refs origin 'v*' | sed -n 's|.*refs/tags/v||p' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' | tr '\n' ' ')"
          test -n "$published"
          node scripts/generate-update-manifest.mjs \
            --directory release-artifacts \
            --output release-artifacts/mdbase-connect-channel-v1.json \
            --version "$version" \
            --repository "$GITHUB_REPOSITORY" \
            --rollout "$rollout" \
            --blocked-versions "${UPDATE_BLOCKED_VERSIONS:-}" \
            --minimum-version "$minimum" \
            --published-versions "$published"
          cp \
            release-artifacts/mdbase-connect-channel-v1.json \
            release-artifacts/mdbase-connect-update.json
          find release-artifacts -maxdepth 1 -type f -name 'update-input-*.json' -delete
          for manifest in \
            release-artifacts/mdbase-connect-channel-v1.json \
            release-artifacts/mdbase-connect-update.json
          do
            cosign sign-blob \
              --yes \
              --bundle "$manifest.sigstore.json" \
              "$manifest"
            cosign verify-blob \
              --bundle "$manifest.sigstore.json" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/desktop-release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$manifest"
          done
          sha256sum \
            release-artifacts/mdbase-connect-channel-v1.json \
            release-artifacts/mdbase-connect-channel-v1.json.sigstore.json \
            release-artifacts/mdbase-connect-update.json \
            release-artifacts/mdbase-connect-update.json.sigstore.json \
            > release-artifacts/SHA256SUMS-update

      - name: Verify exact production candidate before client publication
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_VERIFIED_COMMIT: ${{ inputs.production_verified_commit }}
        run: node scripts/verify-client-publication.mjs

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_type=()
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            release_type+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            release-artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --notes "Files containing **UNSIGNED** are preview builds, not trusted platform releases. Those Windows files may show Unknown Publisher or SmartScreen warnings; those macOS files require a manual Privacy & Security override and have not been notarized. Checksums and GitHub OIDC-backed Sigstore bundles establish build provenance but do not replace platform signing." \
            "${release_type[@]}" \
            --title "mdbase connect $GITHUB_REF_NAME"

  website-update:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    name: Request website release update
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Create website dispatch token
        id: website-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: mdbase-dev
          repositories: mdbase.dev
          permission-contents: write

      - name: Dispatch published release
        env:
          GH_TOKEN: ${{ steps.website-token.outputs.token }}
        run: |
          jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            '{event_type:"connect-client-release-published",client_payload:{tag:$tag}}' \
            | gh api \
                --method POST \
                "repos/mdbase-dev/mdbase.dev/dispatches" \
                --input -

  headless-package-smoke:
    needs: select-tests
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.select-tests.result == 'success' && needs.select-tests.outputs.headless == 'true')) }}
    name: ${{ matrix.label }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Headless macOS Apple Silicon smoke test
            os: macos-15
            platform: macos
            arch: arm64
          - label: Headless macOS Intel smoke test
            os: macos-15-intel
            platform: macos
            arch: x64
          # Windows is exercised by windows-package-smoke, which already
          # builds the same daemon for the Store package.
          - label: Headless Linux smoke test
            os: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mdbase-connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mdbase-connect

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Restore only: rust-caches.yml saves from main.
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            mdbase-connect/runtime -> target
          shared-key: mdbase-daemon-release-${{ hashFiles('mdbase-connect/runtime/Cargo.lock') }}
          save-if: false

      - id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The bundled daemon and headless CLI: one package from runtime/, stamped
      # with the app version so `mdbase --version` and readiness report it.
      - name: Build the mdbase daemon from runtime/
        shell: bash
        working-directory: mdbase-connect/runtime
        env:
          MDBN_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          rustup toolchain install
          scripts/check-release-features.sh mdbn-daemon
          cargo build --release --locked -p mdbn-daemon --bin mdbase
          binary="$PWD/target/release/mdbase"
          if [ "$RUNNER_OS" = "Windows" ]; then binary="$(cygpath -w "$binary.exe")"; fi
          "$binary" --version | grep -qF "$MDBN_RELEASE_VERSION"
          echo "MDBN_DAEMON_BIN=$binary" >> "$GITHUB_ENV"
          echo "MDBN_DAEMON_VERSION=$MDBN_RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Exercise the standalone release
        shell: bash
        run: scripts/ci/smoke-headless-cli.sh "${{ matrix.platform }}" "${{ matrix.arch }}"

  bundle-check:
    needs: select-tests
    if: github.event_name == 'pull_request' && needs.select-tests.outputs.bundle == 'true'
    name: Desktop and editor bundle check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Build the shipped desktop JS bundles without native packaging
        run: pnpm --filter @mdbase/connect-desktop build:standalone
      - run: pnpm --filter mdbase-editor build
      - run: node --test scripts/lib/package-headless-cli.test.mjs
      - run: pnpm --filter mdbase-editor test

  cross-platform-release-tests:
    needs: select-tests
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.select-tests.result == 'success' && (needs.select-tests.outputs.headless == 'true' || needs.select-tests.outputs.windows == 'true'))) }}
    name: ${{ matrix.label }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows release regression tests
            os: windows-2025
          - label: macOS Intel release regression tests
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mdbase-connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mdbase-connect

      # Keep 6.0.9 until the action can bootstrap pnpm 11.15.1 on Intel macOS:
      # 6.1.0 fails self-update with ERR_PNPM_PNPM_ENGINE_IDENTITY_UNVERIFIABLE.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mdbase-connect/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Exercise the complete editor release build
        run: pnpm --filter mdbase-editor build
      - name: Exercise headless release packaging
        run: node --test scripts/lib/package-headless-cli.test.mjs
      - name: Exercise editor release tests
        run: pnpm --filter mdbase-editor test

  windows-package-smoke:
    needs: select-tests
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.select-tests.result == 'success' && needs.select-tests.outputs.windows == 'true')) }}
    name: Windows Store package smoke test
    runs-on: windows-2025
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mdbase-connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mdbase-connect

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mdbase-connect/pnpm-lock.yaml

      # Restore only: rust-caches.yml saves from main.
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            mdbase-connect/runtime -> target
          shared-key: mdbase-daemon-release-${{ hashFiles('mdbase-connect/runtime/Cargo.lock') }}
          save-if: false

      - name: Configure smoke-test Store identity
        shell: pwsh
        run: |
          ./scripts/configure-windows-store-package.ps1 `
            -IdentityName "dev.mdbase.connect.ci" `
            -Publisher "CN=mdbase Connect CI" `
            -PublisherDisplayName "mdbase" `
            -PackageVersion "1.0.${{ github.run_number }}.0"

      - run: pnpm install --frozen-lockfile
      - id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The bundled daemon and headless CLI: one package from runtime/, stamped
      # with the app version so `mdbase --version` and readiness report it.
      - name: Build the mdbase daemon from runtime/
        shell: bash
        working-directory: mdbase-connect/runtime
        env:
          MDBN_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          rustup toolchain install
          scripts/check-release-features.sh mdbn-daemon
          cargo build --release --locked -p mdbn-daemon --bin mdbase
          binary="$PWD/target/release/mdbase"
          if [ "$RUNNER_OS" = "Windows" ]; then binary="$(cygpath -w "$binary.exe")"; fi
          "$binary" --version | grep -qF "$MDBN_RELEASE_VERSION"
          echo "MDBN_DAEMON_BIN=$binary" >> "$GITHUB_ENV"
          echo "MDBN_DAEMON_VERSION=$MDBN_RELEASE_VERSION" >> "$GITHUB_ENV"

      - run: pnpm --filter @mdbase/connect-desktop make

      # The same daemon build that headless-package-smoke checks on the other
      # platforms.
      - name: Exercise the standalone Windows release
        if: github.event_name == 'workflow_dispatch' || needs.select-tests.outputs.headless == 'true'
        shell: bash
        run: scripts/ci/smoke-headless-cli.sh windows x64

      - name: Verify Windows package outputs
        shell: pwsh
        run: |
          ./scripts/verify-windows-packages.ps1 `
            -OutPath "apps/desktop/out" `
            -IdentityName $env:WINDOWS_STORE_IDENTITY_NAME `
            -Publisher $env:WINDOWS_STORE_PUBLISHER `
            -PublisherDisplayName $env:WINDOWS_STORE_PUBLISHER_DISPLAY_NAME `
            -PackageVersion $env:WINDOWS_STORE_PACKAGE_VERSION
