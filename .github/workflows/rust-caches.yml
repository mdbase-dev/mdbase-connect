name: Rust caches

# Caches saved on a merge-queue or pull-request ref are invisible to every
# other ref, and a push to main reuses the merge-queue qualification without
# building. This workflow is therefore the only writer of the Rust dependency
# caches that Desktop Release restores; those jobs never save.
on:
  push:
    branches: [main]
    paths:
      - "runtime/Cargo.toml"
      - "runtime/Cargo.lock"
      - "runtime/crates/*/Cargo.toml"
      - "runtime/rust-toolchain.toml"
      - ".github/workflows/rust-caches.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-caches
  cancel-in-progress: true

jobs:
  warm:
    name: ${{ matrix.cache }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - cache: mdbase-daemon-release
            os: ubuntu-24.04
          - cache: mdbase-daemon-release
            os: macos-15
          - cache: mdbase-daemon-release
            os: macos-15-intel
          - cache: mdbase-daemon-release
            os: windows-2025
    defaults:
      run:
        shell: bash
        working-directory: mdbase-connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mdbase-connect
          persist-credentials: false
      - name: Install the runtime/ toolchain
        working-directory: mdbase-connect/runtime
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            mdbase-connect/runtime -> target
          shared-key: mdbase-daemon-release-${{ hashFiles('mdbase-connect/runtime/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the consumers' dependency graph
        working-directory: mdbase-connect/runtime
        run: cargo build --locked --release -p mdbn-daemon --bin mdbase
