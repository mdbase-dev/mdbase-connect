name: Release integrated Workers
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Fixed managed tier (publication only, never deployment authority)
        type: choice
        options: [staging, production]
        default: staging
        required: true
      source_revision:
        description: Existing built main commit (need not equal current main)
        required: true
      build_run_id:
        description: Successful Build integrated Workers run
        required: true
      build_run_attempt:
        description: Exact build attempt
        required: true
permissions:
  contents: read
concurrency:
  group: release-workers-${{ inputs.environment }}
  cancel-in-progress: false
env:
  RELEASE_ENVIRONMENT: ${{ inputs.environment }}
  SOURCE_REVISION: ${{ inputs.source_revision }}
  BUILD_RUN_ID: ${{ inputs.build_run_id }}
  BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
jobs:
  sign:
    if: github.repository == 'mdbase-dev/mdbase-connect' && github.event.repository.private == false && github.ref == 'refs/heads/main' && github.ref_protected == true && github.actor == 'callumalpass' && github.triggering_actor == 'callumalpass'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Selection regressions
        run: node --test scripts/release-workers.test.mjs scripts/select-worker-build.test.mjs
      - name: Authenticate exact existing build and prepare selection (no compilation)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/select-worker-build.mjs prepare
      - name: Install pinned cosign (no cross-repository read token in this job)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Keyless sign and verify exact manifest identity
        env:
          CERTIFICATE_IDENTITY: https://github.com/mdbase-dev/mdbase-connect/.github/workflows/release-workers.yml@refs/heads/main
        run: |
          set -euo pipefail
          cd "runtime/target/$RELEASE_ENVIRONMENT-worker-release/bundle"
          cosign sign-blob --yes --bundle manifest.sigstore.json manifest.json
          cosign verify-blob --bundle manifest.sigstore.json \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository mdbase-dev/mdbase-connect \
            --certificate-github-workflow-ref refs/heads/main \
            --certificate-github-workflow-sha "$GITHUB_SHA" manifest.json
      - name: Verify no bytes changed while signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/select-worker-build.mjs check
      - name: Publish signed managed candidate (not deployment or acceptance authority)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.environment }}-workers-${{ inputs.source_revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/target/${{ inputs.environment }}-worker-release/bundle/
          if-no-files-found: error
          retention-days: 90
