<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfcfd" />
    <meta name="description" content="A quiet editor for mdbase collections." />
    <link rel="icon" href="./mdbase-favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const theme = localStorage.getItem("mdbase:theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        const dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.querySelector('meta[name="theme-color"]').content = dark ? "#1b1d23" : "#fcfcfd";
      } catch {}
    </script>
    <title>mdbase editor</title>
  </head>
  <body>
    <div id="root"><div class="app-shell editor-opening surface-notes pane-notes" aria-hidden="true"><aside class="collection-rail"></aside><section class="note-list-pane"><header class="list-header"><span class="opening-brand-skeleton"></span></header><div class="note-list-controls"><div class="search-field"><span class="opening-brand-skeleton"></span></div></div><div class="note-selection-slot"></div><div class="opening-list-skeleton"><span></span><span></span><span></span><span></span><span></span><span></span></div></section><div class="editor-pane"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
