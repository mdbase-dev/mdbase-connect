<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfcfd" />
    <meta name="description" content="A quiet editor for mdbase collections." />
    <link rel="icon" href="./mdbase-favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const theme = localStorage.getItem("mdbase:theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        const dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.querySelector('meta[name="theme-color"]').content = dark ? "#1b1d23" : "#fcfcfd";
      } catch {}
    </script>
    <title>mdbase editor</title>
  </head>
  <body>
    <div id="root">
      <div class="app-shell editor-opening surface-notes pane-notes" aria-hidden="true">
        <aside class="collection-rail"></aside>
        <section class="note-list-pane">
          <header class="editor-bar opening-toolbar">
            <button class="icon-button" aria-label="Back to notes" disabled><svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z" /></svg></button>
            <button class="icon-button" aria-label="New note" disabled><svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M213.66,82.34l-56-56A8,8,0,0,0,152,24H56A16,16,0,0,0,40,40V216a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V88A8,8,0,0,0,213.66,82.34ZM160,51.31,188.69,80H160ZM56,216V40h88V88a8,8,0,0,0,8,8h48V216Zm104-64a8,8,0,0,1-8,8H136v16a8,8,0,0,1-16,0V160H104a8,8,0,0,1,0-16h16V128a8,8,0,0,1,16,0v16h16A8,8,0,0,1,160,152Z" /></svg></button>
            <div class="note-actions"><button class="icon-button" aria-label="More note actions" disabled><svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><circle cx="60" cy="128" r="16" /><circle cx="128" cy="128" r="16" /><circle cx="196" cy="128" r="16" /></svg></button></div>
          </header>
          <header class="list-header"><div><h1>All notes</h1><p>Reading notes and files</p></div></header>
          <div class="note-list-controls"><div class="search-field"><input aria-label="Search notes and files" placeholder="Search" disabled /></div></div>
          <div class="note-selection-slot"></div>
          <div class="opening-list-skeleton"><div><span></span><span></span><span></span></div><div><span></span><span></span><span></span></div><div><span></span><span></span><span></span></div><div><span></span><span></span><span></span></div><div><span></span><span></span><span></span></div><div><span></span><span></span><span></span></div></div>
        </section>
        <div class="editor-pane"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
