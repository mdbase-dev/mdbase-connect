name: Test and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
        env:
          MDBASE_EDITOR_ORIGIN: https://editor.mdbase.dev
          MDBASE_EDITOR_BASE_PATH: /

  deploy-cloudflare:
    if: github.event_name != 'pull_request' && vars.CLOUDFLARE_PAGES_ENABLED == '1'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://editor.mdbase.dev/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Cloudflare Pages application
        run: pnpm build
        env:
          MDBASE_EDITOR_ORIGIN: https://editor.mdbase.dev
          MDBASE_EDITOR_BASE_PATH: /
      - name: Verify Cloudflare Pages manifest
        run: node -e 'const manifest = require("./dist/.well-known/mdbase-app.json"); if (manifest.homepage !== "https://editor.mdbase.dev/" || manifest.redirect_uris?.[0] !== "https://editor.mdbase.dev/" || manifest.requirements?.access !== "full_collection") process.exit(1)'
      - name: Deploy Cloudflare Pages
        run: npx --yes --package wrangler@4.114.0 wrangler pages deploy dist --project-name=mdbase-editor --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
