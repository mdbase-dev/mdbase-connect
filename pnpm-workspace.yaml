packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

# Electron Forge packages the desktop app from the physical dependency tree.
# Its pnpm integration requires a hoisted linker rather than isolated symlinks.
nodeLinker: hoisted
hoistingLimits: workspaces
verifyDepsBeforeRun: false

supportedArchitectures:
  os:
    - current
  cpu:
    - current

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  workerd: true

overrides:
  "@hono/node-server": "2.0.11"
  "@xmldom/xmldom@<0.9.12": "0.9.12"
  "sharp@<0.35.4": "0.35.4"
  "@electron/rebuild": "4.2.0"
  "@xmldom/xmldom@>=0.9.0 <0.9.12": "0.9.12"
  "sharp@>=0.35.0 <0.35.4": "0.35.4"
  "find-my-way": "9.7.0"
  "hono@<4.13.7": "4.13.7"
  "brace-expansion@<5.0.12": "5.0.12"
  "devalue@<5.9.3": "5.9.3"
  "browserslist@<4.28.7": "4.28.7"
  "fast-uri@>=3.0.0 <3.1.8": "3.1.8"
  "fast-uri@>=4.0.0 <4.1.5": "4.1.5"
  "ip-address@<10.7.1": "10.7.1"
  "moment@>=2.29.2 <2.31.0": "2.31.0"
  "extract-zip@<=2.0.1": "npm:@electron-internal/extract-zip@1.0.5"
  "nanoid@<3.3.18": "3.3.18"
  "postcss@<=8.5.22": "8.5.23"
  "undici@>=6.0.0 <6.28.1": "6.28.1"
  "undici@>=7.0.0 <7.29.1": "7.29.1"
  "tar@<7.5.21": "7.5.21"
  "tmp@<0.2.6": "0.2.7"
  "http-cache-semantics@<=4.2.0": "4.3.0"
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"
  "vue@>=3.0.0 <3.5.42": "3.5.42"
  "@vue/server-renderer@>=3.0.0 <3.5.42": "3.5.42"

# appdmg only uses image-size for PNG DMG backgrounds; the affected ICNS,
# JXL, and HEIF parsers are not reachable there. Patched image-size 2.0.3
# is now published, but changes the callable/file-path API used by appdmg.
# Qualify that adapter transition before removing this scoped exception.
#
# GHSA-vfj7-8cjw-p6xm (braces, stack exhaustion from deeply nested patterns)
# is reached only through @electron-forge at desktop build time, where
# fast-glob expands Forge's own configured patterns; no untrusted pattern
# reaches it and it is not in a shipped runtime. Braces 3.0.3 remains latest;
# remove its exception when a patched release is published.
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-vfj7-8cjw-p6xm

minimumReleaseAgeExclude:
  - hono@4.13.7

patchedDependencies:
  electron-installer-common@0.10.4: patches/electron-installer-common@0.10.4.patch
  electron-installer-redhat@3.4.0: patches/electron-installer-redhat@3.4.0.patch
