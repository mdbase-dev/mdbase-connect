packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

# Electron Forge packages the desktop app from the physical dependency tree.
# Its pnpm integration requires a hoisted linker rather than isolated symlinks.
nodeLinker: hoisted
hoistingLimits: workspaces
verifyDepsBeforeRun: false

supportedArchitectures:
  os:
    - current
  cpu:
    - current

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  workerd: true

overrides:
  "@hono/node-server": "2.0.11"
  "@xmldom/xmldom@<0.9.12": "0.9.12"
  "sharp@<0.35.4": "0.35.4"
  "@electron/rebuild": "4.2.0"
  "@xmldom/xmldom@>=0.9.0 <0.9.12": "0.9.12"
  "sharp@>=0.35.0 <0.35.4": "0.35.4"
  "find-my-way": "9.7.0"
  "hono@<4.12.34": "4.12.34"
  "brace-expansion@<5.0.11": "5.0.11"
  "devalue@<5.9.3": "5.9.3"
  "browserslist@<4.28.7": "4.28.7"
  "fast-uri@>=3.0.0 <3.1.8": "3.1.8"
  "fast-uri@>=4.0.0 <4.1.5": "4.1.5"
  "ip-address@<10.3.1": "10.3.1"
  "extract-zip@<=2.0.1": "npm:@electron-internal/extract-zip@1.0.5"
  "nanoid@<3.3.18": "3.3.18"
  "postcss@<=8.5.22": "8.5.23"
  "undici@>=6.0.0 <6.28.1": "6.28.1"
  "undici@>=7.0.0 <7.29.1": "7.29.1"
  "tar@<7.5.21": "7.5.21"
  "tmp@<0.2.6": "0.2.7"

# appdmg only uses image-size for PNG DMG backgrounds. The affected ICNS,
# JXL, and HEIF parsers are not reachable there, and the advisory's patched
# image-size 2.0.3 release has not yet been published to npm.
#
# GHSA-vfj7-8cjw-p6xm (braces, stack exhaustion from deeply nested patterns)
# is reached only through @electron-forge at desktop build time, where
# fast-glob expands Forge's own configured patterns; no untrusted pattern
# reaches it and it is not in a shipped runtime.
# GHSA-ch52-4w7c-c8xp (http-cache-semantics, max-stale handling can disclose
# cross-user cached responses) is reached through @electron-forge at build time
# and, at runtime, through sigstore's TUF client (tuf-js > make-fetch-happen)
# in the desktop release verifier (apps/desktop/src/main/release-source.ts).
# That client caches only public Sigstore trust metadata in one OS user's
# trust-cache directory; there is no cache shared between users, so the
# cross-user disclosure cannot occur.
# Neither advisory has a patched release (braces 3.0.3 and
# http-cache-semantics 4.2.0 are the latest); remove both once patches publish.
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-ch52-4w7c-c8xp

minimumReleaseAgeExclude:
  - hono@4.12.34

patchedDependencies:
  electron-installer-common@0.10.4: patches/electron-installer-common@0.10.4.patch
  electron-installer-redhat@3.4.0: patches/electron-installer-redhat@3.4.0.patch
